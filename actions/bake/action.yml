---
name: Bake a wiki with wikven
description: Bake a MediaWiki source tree into a static site with wikven.
branding:
  icon: book-open
  color: blue

inputs:
  source:
    description: Directory holding the wiki source files to bake.
    default: src
  output:
    description: Directory the static site is written to.
    default: dist
  image:
    description: >-
      The wikven image to run. Defaults to the release this action was cut from;
      override to pin a different tag (e.g. ghcr.io/chaotic-ground/wikven:1.2.3).
    default: ghcr.io/chaotic-ground/wikven:1.0.0  # x-release-please-version
  cache:
    description: >-
      Cache the pulled image between runs, keyed on the image ref. Set to
      "false" to always pull fresh. Takes "true" or "false" and refuses
      anything else, rather than reading it as "false" and going quiet.
    default: "true"
  fetch-cache:
    description: >-
      Keep the extensions and skins WikvenRepositories pins between runs, so a
      bake fetches them from their hosts once rather than on every push. Keyed
      on the site's wikven configuration file, which is where the pins are, and
      a tree is used only where it still answers the pin it was fetched for.
      Takes "true" or "false" and refuses anything else.
    default: "true"
  source-date-epoch:
    description: >-
      Unix time the built site should claim its content was last written, as
      SOURCE_DATE_EPOCH (https://reproducible-builds.org/docs/source-date-epoch/).
      Defaults to the commit date of HEAD, which makes the "last edited" dates
      true of the commit and identical for every bake of it. Left unset if the
      checkout has no git history, and the bake then uses a fixed date.
    default: ""
  jobs:
    description: >-
      How many skin passes to render beside each other, as WIKVEN_BUILD_JOBS.
      A pass is a MediaWiki boot with a boot's worth of memory, so a runner
      that runs out of it renders one at a time with "1". Left unset the build
      counts the processors it is allowed and uses one pass per processor.
    default: ""

runs:
  using: composite
  steps:
    # The image ref is immutable per tag, so a cache hit needs no re-pull.
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/wikven/image.tar
        key: wikven-image-${{ inputs.image }}
    # The key is the pins: the configuration file WikvenRepositories is written in. A tree fetched
    # for another site's pins is not this site's to reuse, and one whose pin moved is refetched by
    # the bake itself, so the worst a wrong key does is fetch what it already had.
    - id: fetch-cache-key
      if: inputs.fetch-cache == 'true'
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        # The names wikven accepts for a site's configuration file, in its own precedence order.
        for name in .wikven.yaml .wikven.yml .wikven.json wikven.yaml wikven.yml wikven.json; do
          if [ -f "$SOURCE/$name" ]; then
            printf 'key=wikven-fetch-%s\n' "$(sha256sum < "$SOURCE/$name" | cut -c1-32)" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        # No configuration file is no WikvenRepositories: nothing is fetched, so nothing is kept.
        echo "key=" >> "$GITHUB_OUTPUT"
    - if: inputs.fetch-cache == 'true' && steps.fetch-cache-key.outputs.key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/wikven/fetch
        key: ${{ steps.fetch-cache-key.outputs.key }}
    - shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        OUTPUT: ${{ inputs.output }}
        IMAGE: ${{ inputs.image }}
        CACHE: ${{ inputs.cache }}
        FETCH_CACHE: ${{ inputs.fetch-cache }}
        FETCH_KEY: ${{ steps.fetch-cache-key.outputs.key }}
        SOURCE_DATE_EPOCH_IN: ${{ inputs.source-date-epoch }}
        JOBS: ${{ inputs.jobs }}
      run: |
        # A value neither "true" nor "false" used to read as "false", so `cache: npm` -- the
        # spelling setup-node and setup-python take, where the value names what to cache -- turned
        # caching off and said nothing. Refuse it instead: a workflow that meant something by a
        # value deserves to hear that this action did not take it.
        require_boolean() {
          case "$2" in
            true | false) ;;
            *)
              echo "::error::wikven: '$1' takes \"true\" or \"false\", not \"$2\"."
              exit 1
              ;;
          esac
        }
        require_boolean cache "$CACHE"
        require_boolean fetch-cache "$FETCH_CACHE"
        # The same shape the build accepts, so a value it would drop back from is refused here
        # instead: WIKVEN_BUILD_JOBS reads /^[1-9]\d*$/ on a trimmed value and silently counts
        # processors otherwise, which would leave "0" or "007" looking like it had been taken.
        # `read` does the trimming the build does, so the two agree on every string.
        read -r JOBS <<< "$JOBS" || true
        case "$JOBS" in
          '' | [1-9] | [1-9][0-9]*) ;;
          *)
            echo "::error::wikven: 'jobs' takes a whole number of passes from 1 up, not \"$JOBS\"."
            exit 1
            ;;
        esac
        tar="$HOME/.cache/wikven/image.tar"
        if [ "$CACHE" = "true" ] && [ -f "$tar" ]; then
          docker load -i "$tar"
        elif ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
          # Not cached and not already local (a registry ref): pull it. A local build is used as-is.
          docker pull "$IMAGE"
          if [ "$CACHE" = "true" ]; then
            mkdir -p "$(dirname "$tar")"
            docker save "$IMAGE" -o "$tar"
          fi
        fi
        mkdir -p "$OUTPUT"
        # Unset unless resolved: the bake falls back to a fixed date rather than the build clock.
        if [ -z "$SOURCE_DATE_EPOCH_IN" ]; then
          SOURCE_DATE_EPOCH_IN=$(git log -1 --format=%ct 2>/dev/null || true)
        fi
        epoch=()
        case "$SOURCE_DATE_EPOCH_IN" in
          '' | *[!0-9]*) ;;
          *) epoch=(-e "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH_IN") ;;
        esac
        jobs=()
        if [ -n "$JOBS" ]; then
          jobs=(-e "WIKVEN_BUILD_JOBS=$JOBS")
        fi
        # Mounted only where there is a key to cache it under, so a site with nothing pinned gets
        # no directory it never fills. The bake decides for itself whether what is in there still
        # answers the pins; a stale or half-written tree is refetched, not built from.
        fetch=()
        if [ "$FETCH_CACHE" = "true" ] && [ -n "$FETCH_KEY" ]; then
          dir="$HOME/.cache/wikven/fetch"
          mkdir -p "$dir"
          fetch=(-v "$dir:/workspace/fetch" -e WIKVEN_FETCH_DIR=/workspace/fetch)
        fi
        # Each page is dated at the commit that last touched its source file, and credited to that
        # commit's author. Only this side can see the history -- the container is given the source
        # directory alone, with no .git beside it -- so dump the log for it here. Paths come out
        # relative to the source directory, NUL-separated so none of them needs quoting; the
        # author's email rides along to tie their several spellings of their own name together.
        # A shallow checkout holds one commit, which would date every page at the last push to the
        # branch and credit whoever made it, so it is refused rather than read. Both commands run
        # inside the `if`, where a failing one is an answer rather than an aborted step.
        history=()
        log="${RUNNER_TEMP:-/tmp}/wikven-source-history"
        if [ "$(git -C "$SOURCE" rev-parse --is-shallow-repository 2>/dev/null)" = false ] \
          && git -C "$SOURCE" -c core.quotePath=false log -z --relative --no-renames \
               --format="%x01%ct%x09%an%x09%ae" --name-only -- . > "$log"; then
          history=(-v "$log:/workspace/source-history:ro")
        else
          echo "wikven: no per-file history for '$SOURCE'; every page will be dated at the commit" \
               "being built. Check the repository out with fetch-depth: 0 for per-page dates."
        fi
        # Source read-only. A bake runs the third-party code WikvenRepositories names, and a
        # writable mount would let that code edit the checkout this job goes on to use. Only the
        # translate subcommands write into src/, and this action never runs one.
        docker run --rm \
          -v "$PWD/$SOURCE:/workspace/src:ro" \
          -v "$PWD/$OUTPUT:/workspace/dist" \
          "${epoch[@]}" \
          "${jobs[@]}" \
          "${fetch[@]}" \
          "${history[@]}" \
          "$IMAGE"
