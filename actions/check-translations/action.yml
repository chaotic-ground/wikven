---
name: Check wikven translations
description: Report broken source pages, and out-of-date or missing translations, in a wikven source tree.
branding:
  icon: globe
  color: blue

inputs:
  source:
    description: Directory holding the wiki source files to check.
    default: src
  image:
    description: >-
      The wikven image to run. Defaults to the release this action was cut from;
      override to pin a different tag (e.g. ghcr.io/chaotic-ground/wikven:1.2.3).
    default: ghcr.io/chaotic-ground/wikven:0.1.0  # x-release-please-version
  gate:
    description: >-
      Fail the step (non-zero exit) when a source page is broken: one Translate
      cannot parse, or one the two readings disagree on. A translation that is
      stale or missing is always reported and never fails the step. Set to
      "false" to report even a broken page without failing. Takes "true" or
      "false" and refuses anything else.
    default: "true"
  comment:
    description: >-
      Also leave what was found as a comment on the pull request, grouped by
      what went wrong and saying which translate command fixes it. Off by
      default: annotations are enough for a maintainer, and a comment is for a
      contributor meeting the workflow for the first time. Needs
      "pull-requests: write" on the job, and does nothing outside a pull
      request. One comment per pull request, edited on each run, and replaced
      with an all-clear once the findings are answered. The comment is about
      the files the pull request touches -- and the translations of any source
      page it touches -- rather than about the whole tree, so a page that fell
      behind long before this change is left to the annotations. Takes "true"
      or "false" and refuses anything else.
    default: "false"
  comment-languages:
    description: >-
      Languages the comment is written in besides English, which always leads.
      "auto" takes them from what was found, so a contributor who sent a Korean
      translation is answered in Korean under the English; a comma-separated
      list of codes (e.g. "ko,fr") names them outright. The wording comes from
      wikven's own i18n messages, so a language nobody has translated those into
      falls back to English and is left out rather than repeated. Does nothing
      unless "comment" is on.
    default: ""
  github-token:
    description: >-
      Token the comment is posted with. The default job token is enough where
      the job has pull-requests: write; a pull request from a fork gets a
      read-only one, and the comment is then skipped with a notice rather than
      failing the run.
    default: ${{ github.token }}
  cache:
    description: >-
      Cache the pulled image between runs, keyed on the image ref. Set to
      "false" to always pull fresh. Takes "true" or "false" and refuses
      anything else, rather than reading it as "false" and going quiet.
    default: "true"

runs:
  using: composite
  steps:
    # The image ref is immutable per tag, so a cache hit needs no re-pull.
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/wikven/image.tar
        key: wikven-image-${{ inputs.image }}
    - shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        IMAGE: ${{ inputs.image }}
        GATE: ${{ inputs.gate }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_LANGUAGES: ${{ inputs.comment-languages }}
        CACHE: ${{ inputs.cache }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
      run: |
        # A value neither "true" nor "false" used to read as "false", so `cache: npm` -- the
        # spelling setup-node and setup-python take, where the value names what to cache -- turned
        # caching off and said nothing. Refuse it instead: a workflow that meant something by a
        # value deserves to hear that this action did not take it.
        require_boolean() {
          case "$2" in
            true | false) ;;
            *)
              echo "::error::wikven: '$1' takes \"true\" or \"false\", not \"$2\"."
              exit 1
              ;;
          esac
        }
        require_boolean cache "$CACHE"
        require_boolean gate "$GATE"
        require_boolean comment "$COMMENT"
        tar="$HOME/.cache/wikven/image.tar"
        if [ "$CACHE" = "true" ] && [ -f "$tar" ]; then
          docker load -i "$tar"
        elif ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
          # Not cached and not already local (a registry ref): pull it. A local build is used as-is.
          docker pull "$IMAGE"
          if [ "$CACHE" = "true" ]; then
            mkdir -p "$(dirname "$tar")"
            docker save "$IMAGE" -o "$tar"
          fi
        fi
        gate=()
        if [ "$GATE" = "true" ]; then
          gate=(--gate)
        fi
        # The comment body is written by the check itself, into a directory of its own that is the
        # one thing this run mounts writable. Asked for only when it will be used, so a run without
        # comments still writes nothing anywhere.
        report="${RUNNER_TEMP:-/tmp}/wikven-translations"
        body="$report/comment.md"
        comment=()
        mounts=()
        if [ "$COMMENT" = "true" ]; then
          rm -rf "$report"
          mkdir -p "$report"
          mounts=(-v "$report:/report")
          comment=(--comment-file /report/comment.md)
          if [ -n "$COMMENT_LANGUAGES" ]; then
            comment+=(--comment-languages "$COMMENT_LANGUAGES")
          fi
          # What the pull request touches, so the comment can be about that and not about the
          # whole wiki. A page that has been waiting for a translation since long before this
          # change is not this contributor's to answer, and a comment that says so on every
          # change is one nobody reads. The annotations still cover everything.
          #
          # Asked of the forge rather than worked out from the checkout, which is a shallow one
          # and has no base commit to compare against. A list that cannot be had is not worth
          # failing over: the check then comments about everything, which is what it did before.
          if [ -n "$PULL_REQUEST" ]; then
            if gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
                 --jq '.[].filename' > "$report/changed.txt"; then
              comment+=(--comment-paths /report/changed.txt)
            else
              echo "::warning::wikven: could not read what this change touches;" \
                   "the translations comment will cover every page."
            fi
          fi
        fi
        # Source is read-only for a check; no dist mount, nothing of yours is written.
        # --path-prefix makes the annotation file names repo-relative (they resolve under $SOURCE).
        #
        # The status is kept rather than allowed to end the step, because a failing check is exactly
        # when the comment is worth having: it is posted below, and the status is the step's again
        # on the last line.
        status=0
        docker run --rm \
          -v "$PWD/$SOURCE:/workspace/src:ro" \
          "${mounts[@]}" \
          "$IMAGE" translate check "${gate[@]}" --path-prefix "$SOURCE" "${comment[@]}" || status=$?

        if [ "$COMMENT" = "true" ] && [ -s "$body" ]; then
          if [ -z "$PULL_REQUEST" ]; then
            echo "wikven: not a pull request; the comment has nowhere to go."
          else
            # One comment per pull request: the body carries a hidden marker, so the one this action
            # left before is found and edited instead of a new one arriving on every push.
            existing=$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
              --jq 'map(select(.body | startswith("<!-- wikven-check-translations -->")))
                    | first | .id // empty' 2>/dev/null || true)
            posted=true
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" -F body=@"$body" \
                >/dev/null || posted=false
            elif grep -q '^<!-- wikven-check-translations:clear -->$' "$body"; then
              # Nothing found and nothing said before: a pull request that never had a complaint has
              # no use for a comment saying there is none.
              posted=true
            else
              gh api -X POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@"$body" \
                >/dev/null || posted=false
            fi
            if [ "$posted" != "true" ]; then
              # A fork's token is read-only, and a job without pull-requests: write has no rights
              # either. Neither is a reason to fail a check that has already reported everything it
              # found as annotations.
              echo "::warning::wikven: could not post the translations comment (needs" \
                   "pull-requests: write, which a pull request from a fork does not get)."
            fi
          fi
        fi
        exit "$status"
