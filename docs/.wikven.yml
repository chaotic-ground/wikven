---
extensions:
  - Gadgets
  - MobileFrontend
  - ParserFunctions
  # This site has one Lua module, and Special:MyLanguage/Lua modules is about it. Listing Scribunto
  # is all it takes: MediaWiki bundles the extension and the image compiles luasandbox into its PHP.
  - Scribunto
  - SyntaxHighlight_GeSHi
  - TabberNeue
  - TemplateStyles
  - Translate
  - UniversalLanguageSelector
# With Vector from default.yml, this is the whole supported set.
skins:
  - Citizen
  - MinervaNeue
config:
  WikvenFooterUrl: https://github.com/chaotic-ground/wikven
  WikvenEditUrl: https://github.com/chaotic-ground/wikven/edit/main/docs/$1
  WikvenHistoryUrl: https://github.com/chaotic-ground/wikven/commits/main/docs/$1
  WikvenViewSourceUrl: https://github.com/chaotic-ground/wikven/blob/main/docs/$1
  WikvenLogos:
    icon: logo.svg
  # Translated pages may be in a script the reader's system has no font for.
  WikvenBundleWebfonts: true
  # Search results have no thumbnails, so drop the empty thumbnail column from
  # the typeahead. Both skins that mount core's Codex typeahead need telling
  # separately: each reads its own config var, and each is replaced wholesale
  # rather than merged, so the API keys are restated at their own defaults.
  VectorTypeahead:
    apiUrl: null
    recommendationApiUrl: null
    options:
      showThumbnail: false
      showDescription: true
  MinervaTypeahead:
    apiUrl: null
    recommendationApiUrl: null
    options:
      showThumbnail: false
      showDescription: true
  # SifterSearch is built in and indexes into dist by default; this site serves under /wikven.
  SifterSearchBundlePath: /wikven/pagefind/
  SifterSearchResultsPage: "Search"
  WikvenRepositories:
    # TabberNeue is not bundled in the image; clone it from Git to show off
    # third-party fetching. (TemplateStyles, which the templates use, is bundled
    # in MediaWiki 1.46, so it needs no source here.) Pinned to a release tag,
    # which updatecli moves.
    TabberNeue:
      repository: https://github.com/StarCitizenTools/mediawiki-extensions-TabberNeue.git
      reference: v4.0.0
    # Citizen is a third-party skin, fetched rather than bundled. Wikven handles
    # what it does that a static export cannot serve, so nothing is needed here.
    # Pinned to a release tag, which updatecli moves.
    Citizen:
      repository: https://github.com/StarCitizenTools/mediawiki-skins-Citizen.git
      reference: v3.17.0
    # Minerva is bundled with MediaWiki but MobileFrontend, which it leans on, is not: without it
    # the skin skips initMobile.js entirely (see its setup.js). This site builds the pair so the
    # configuration wikven recommends for Minerva is the one CI renders. Mirrored from Gerrit,
    # which throttles Actions runners.
    # Pinned to a commit rather than to REL1_46's tip, so a build of a given revision of this
    # repository fetches the code that revision was tested against. updatecli moves the pin.
    MobileFrontend:
      repository: https://github.com/wikimedia/mediawiki-extensions-MobileFrontend.git
      commit: fe7cb1a753c901d5a9b84bae7f727037e8820bec
