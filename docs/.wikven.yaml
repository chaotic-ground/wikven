---
extensions:
  - Gadgets
  - MobileFrontend
  - ParserFunctions
  # This site has one Lua module, and Special:MyLanguage/Lua modules is about it. Listing Scribunto
  # is all it takes: MediaWiki bundles the extension and the image compiles luasandbox into its PHP.
  - Scribunto
  - SyntaxHighlight_GeSHi
  - TabberNeue
  - TemplateStyles
  - Translate
  - WikiSEO
  - UniversalLanguageSelector
# With Vector from default.yml, this is the whole supported set.
skins:
  - Citizen
  - MinervaNeue
config:
  # Where this site is served from. Nothing in a build can work this out for itself: it renders
  # against a local server and links every page relatively, which is what lets an export run from
  # any directory and any host. Anything that has to name a page from outside the site is built
  # from this.
  WikvenSiteUrl: https://chaotic-ground.github.io/wikven/
  # Proves to Google that whoever registered this site in Search Console controls it. WikiSEO turns
  # it into a meta tag on every page; the value is a public token, not a credential -- it grants
  # nothing but the claim, and Google publishes it back to anyone who asks for the site's tag.
  GoogleSiteVerificationKey: 2rzhjoB0M6oJLKFCyvqcW6_SGAkxpf7o4RIWOGfpfPY
  # The picture a link to this site shows when it is shared. WikiSEO reads it, resolves the name in
  # the File: namespace, and writes the address into og:image and the schema.org block; the export
  # moves the file into the asset directory and takes those addresses with it. Drawn from the logo,
  # at the 1200x630 a social platform lays out above the title rather than beside it.
  WikiSeoDefaultImage: card.png
  WikvenFooterUrl: https://github.com/chaotic-ground/wikven
  WikvenEditUrl: https://github.com/chaotic-ground/wikven/edit/main/docs/$1
  WikvenHistoryUrl: https://github.com/chaotic-ground/wikven/commits/main/docs/$1
  WikvenViewSourceUrl: https://github.com/chaotic-ground/wikven/blob/main/docs/$1
  WikvenLogos:
    icon: logo.svg
    # The same mark as a raster, and only the schema.org block reads it. WikiSEO names the site's
    # logo by walking these values for the first jpg/jpeg/png/gif/webp, and takes an SVG as no logo
    # at all; with the icon alone every page carried "logo": [], which asserts the site has no logo
    # rather than saying nothing about one. No skin is affected: a skin with an icon renders that,
    # and 1x is the fallback for one without.
    1x: logo.png
  # Translated pages may be in a script the reader's system has no font for.
  WikvenBundleWebfonts: true
  # Search results have no thumbnails, so drop the empty thumbnail column from
  # the typeahead. Both skins that mount core's Codex typeahead need telling
  # separately: each reads its own config var, and each is replaced wholesale
  # rather than merged, so the API keys are restated at their own defaults.
  VectorTypeahead:
    apiUrl: null
    recommendationApiUrl: null
    options:
      showThumbnail: false
      showDescription: true
  MinervaTypeahead:
    apiUrl: null
    recommendationApiUrl: null
    options:
      showThumbnail: false
      showDescription: true
  # SifterSearch is built in and indexes into dist by default; this site serves under /wikven.
  SifterSearchBundlePath: /wikven/pagefind/
  SifterSearchResultsPage: "Search"
  WikvenRepositories:
    # TabberNeue is not bundled in the image; clone it from Git to show off
    # third-party fetching. (TemplateStyles, which the templates use, is bundled
    # in MediaWiki 1.46, so it needs no source here.) Pinned to a release tag,
    # which updatecli moves.
    TabberNeue:
      repository: https://github.com/StarCitizenTools/mediawiki-extensions-TabberNeue.git
      reference: v4.0.2
    # Citizen is a third-party skin, fetched rather than bundled. Wikven handles
    # what it does that a static export cannot serve, so nothing is needed here.
    # Pinned to a release tag, which updatecli moves.
    Citizen:
      repository: https://github.com/StarCitizenTools/mediawiki-skins-Citizen.git
      reference: v3.21.0
    # Minerva is bundled with MediaWiki but MobileFrontend, which it leans on, is not: without it
    # the skin skips initMobile.js entirely (see its setup.js). This site builds the pair so the
    # configuration wikven recommends for Minerva is the one CI renders. Mirrored from Gerrit,
    # which throttles Actions runners.
    # Pinned to a commit rather than to REL1_46's tip, so a build of a given revision of this
    # repository fetches the code that revision was tested against. updatecli moves the pin.
    MobileFrontend:
      repository: https://github.com/wikimedia/mediawiki-extensions-MobileFrontend.git
      commit: f0212f7fc0dc3403b8da334250af2188b07143ec
    # WikiSEO writes the head tags a static export cannot get any other way: the site
    # verification token above, and later the canonical and hreflang links. Not bundled in the
    # image, so it is fetched here.
    #
    # Pinned to REL1_46's head, like MobileFrontend and for the same reason, rather than to the
    # v2.7.0 tag: that tag carries a manifest reading 2.6.6 and MediaWiki >= 1.39, while the branch
    # reads 2.7.0 and >= 1.42. The tag is mis-stamped, so its name promises code it does not hold.
    WikiSEO:
      repository: https://github.com/wikimedia/mediawiki-extensions-WikiSEO.git
      commit: 3f8aeb66f322d6687a3623e377cd8f0488f39f71
