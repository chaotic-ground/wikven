---
# A source tree for looking at a skin. Bake it, open dist/, and what you see is your skin
# rendering a page that carries every element a skin has to style.
#
#   docker run --rm -v "$PWD:/workspace" ghcr.io/chaotic-ground/wikven
#
# with this directory as /workspace/src, or point the bake action's `source:` at it.

# Put your skin here. A skin wikven does not bundle is fetched from a source you declare in
# WikvenRepositories; see Special:MyLanguage/Extensions on the wikven site. Vector comes from
# wikven's own defaults, so leaving this empty still gives you something to compare against.
# skins:
#   - YourSkin

config:
  Sitename: Skin preview

  # The point of this tree. Wikven normally trims the chrome around a page to what a static host
  # can stand behind -- emptying the personal menu and the toolbox, replacing the article tabs,
  # adding a footer link and a stylesheet of its own. Every one of those edits the thing a skin
  # author came to look at, so here they are all off and the skin draws its own.
  WikvenSkinPreview: true

  # The specimen page puts itself in a category and links to the category page, so that page has
  # to be exported too. The default is [0, 6]; this adds the Category namespace rather than
  # replacing it, which a config value does not do for you.
  ContentNamespaces: [0, 6, 14]
