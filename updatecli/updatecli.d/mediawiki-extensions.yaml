---
name: "build(deps): bump the bundled MediaWiki extensions"
pipelineid: mediawiki-extensions

scms:
  default:
    kind: github
    spec:
      owner: chaotic-ground
      repository: wikven
      branch: main
      user: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      labels:
        - dependencies

# Every pin here is a commit, so the branch it follows lives here rather than beside it. It is the
# release branch of the image's MediaWiki, and moves when that base image does. Two are bundled by
# the Dockerfile; the rest are fetched at build time by the docs site, which is the only site that
# installs them.
sources:
  translate:
    name: Head of Translate's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-Translate
      branch: REL1_46
      depth: 1
  uls:
    name: Head of UniversalLanguageSelector's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-UniversalLanguageSelector
      branch: REL1_46
      depth: 1
  mobilefrontend:
    name: Head of MobileFrontend's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-MobileFrontend
      branch: REL1_46
      depth: 1
  wikiseo:
    name: Head of WikiSEO's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-WikiSEO
      branch: REL1_46
      depth: 1
  chart:
    name: Head of Chart's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-Chart
      branch: REL1_46
      depth: 1
  jsonconfig:
    name: Head of JsonConfig's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-JsonConfig
      branch: REL1_46
      depth: 1
  wikihiero:
    name: Head of WikiHiero's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-wikihiero
      branch: REL1_46
      depth: 1
  score:
    name: Head of Score's REL1_46
    kind: gitcommit
    spec:
      url: https://github.com/wikimedia/mediawiki-extensions-Score
      branch: REL1_46
      depth: 1

targets:
  translate:
    name: 'build(deps): bump Translate to {{ source "translate" }}'
    kind: dockerfile
    scmid: default
    sourceid: translate
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: TRANSLATE_VERSION
  uls:
    name: 'build(deps): bump UniversalLanguageSelector to {{ source "uls" }}'
    kind: dockerfile
    scmid: default
    sourceid: uls
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: ULS_VERSION
  mobilefrontend:
    name: 'build(deps): bump MobileFrontend to {{ source "mobilefrontend" }}'
    kind: yaml
    scmid: default
    sourceid: mobilefrontend
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.MobileFrontend.commit
  wikiseo:
    name: 'build(deps): bump WikiSEO to {{ source "wikiseo" }}'
    kind: yaml
    scmid: default
    sourceid: wikiseo
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.WikiSEO.commit
  chart:
    name: 'build(deps): bump Chart to {{ source "chart" }}'
    kind: yaml
    scmid: default
    sourceid: chart
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.Chart.commit
  jsonconfig:
    name: 'build(deps): bump JsonConfig to {{ source "jsonconfig" }}'
    kind: yaml
    scmid: default
    sourceid: jsonconfig
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.JsonConfig.commit
  wikihiero:
    name: 'build(deps): bump WikiHiero to {{ source "wikihiero" }}'
    kind: yaml
    scmid: default
    sourceid: wikihiero
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.wikihiero.commit
  score:
    name: 'build(deps): bump Score to {{ source "score" }}'
    kind: yaml
    scmid: default
    sourceid: score
    spec:
      file: docs/.wikven.yaml
      key: $.config.WikvenRepositories.Score.commit
