[files]
# CHANGELOG.md is generated from a year of commit subjects, and every entry carries the commit's
# short hash: "b5d3ba3" reads as a misspelling of "by". The subjects are in history and cannot be
# corrected now, so nothing here is actionable.
extend-exclude = ["package-lock.json", "CHANGELOG.md"]

[default]
extend-ignore-re = [
  # Translate staleness stamps (<!--T:n @<hex>-->) are md5 fragments, not words.
  '<!--T:\d+ @[0-9a-f]{8}-->',
  # Pagefind names each language's index after a hex digest of it ("ko_72ba3bbda7"), and a test
  # that pins the bundle's entry file quotes them verbatim. Hex, not words.
  '\b[a-z]{2,3}_[0-9a-f]{10}\b',
]
