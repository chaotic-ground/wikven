---
# Rewrite Quibble's in-container coverage paths to the repository layout.
fixes:
  - "/workspace/src/extensions/Wikven/::"

comment: false

coverage:
  status:
    # maintenance/ is half the tree's lines with no unit tests: it dilutes the
    # project total, and its diffs can never meet a patch target.
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 70%
        paths:
          - includes/
