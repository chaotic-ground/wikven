---
name: Chart renderer
description: >-
  Start a chart-renderer container for one bake to draw with, and wait for it to answer.

# Private to this repository, unlike actions/ next door: it stands up scaffolding for baking this
# documentation site, and is not something a site of your own would use. A site of your own points
# ChartServiceUrl at a renderer of its own; see the Charts page.
#
# One container per bake, rather than one service two bakes share. The renderer numbers the class
# names inside an SVG after a counter its process keeps, so a renderer that has already drawn
# something draws the next chart differently -- and smoke.yml bakes this site twice and compares
# the two. A container of its own gives each bake a renderer that has drawn nothing yet.
inputs:
  version:
    description: The chart-renderer commit to run. Pinned, so two bakes draw with the same code.
    required: false
    default: 543b8eec4fa9f56110f3fa3d6957c077e5dc4438

outputs:
  address:
    description: >-
      Where this renderer is, to be given to a bake as the host.docker.internal it should see.
    value: ${{ steps.start.outputs.address }}

runs:
  using: composite
  steps:
    # Built once however many renderers a job wants; the second call finds the image and skips.
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if docker image inspect wikven-chart-renderer >/dev/null 2>&1; then
          exit 0
        fi
        source=$RUNNER_TEMP/chart-renderer
        rm -rf "$source"
        git init --quiet "$source"
        git -C "$source" fetch --quiet --depth 1 \
          https://gitlab.wikimedia.org/repos/mediawiki/services/chart-renderer.git "$VERSION"
        git -C "$source" checkout --quiet FETCH_HEAD
        docker build --quiet --tag wikven-chart-renderer "$source"

    - id: start
      shell: bash
      run: |
        set -euo pipefail
        container=$(docker run --detach wikven-chart-renderer)
        # Its address on the bridge, which is what a bake is told to call host.docker.internal.
        # The runner reaches it there too, which is how the wait below knows it is up.
        address=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")
        probe="http://$address:6284/v1/chart/render"
        for _ in $(seq 60); do
          # Any answer will do: an empty body is a 400, and a 400 is the service talking.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' --data '{}' "$probe")" != "000" ]; then
            echo "address=$address" >> "$GITHUB_OUTPUT"
            echo "wikven: a chart renderer is answering at $address."
            exit 0
          fi
          sleep 2
        done
        echo "::error::the chart renderer never answered; a bake would draw error boxes"
        docker logs "$container" || true
        exit 1
