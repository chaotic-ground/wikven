---
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    # "/" is the workflows only. The composite actions pin their own uses: and need naming.
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # A dependency joins the first group it matches, so MediaWiki always gets its own pull
      # request: a release-branch move needs REL* CI and extension bumps alongside it, and must
      # not hold the routine patches hostage.
      mediawiki:
        patterns:
          - mediawiki
      docker:
        patterns:
          - "*"
        # Majors land as their own pull requests instead of riding along in the group.
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
