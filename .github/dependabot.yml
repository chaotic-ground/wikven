---
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    # Full version tags dropped the stream guard the floating tags carried, so restore it here.
    # MediaWiki holds its minor too: moving to 1.47 has to be deliberate.
    ignore:
      - dependency-name: composer
        update-types:
          - version-update:semver-major
      - dependency-name: dunglas/frankenphp
        update-types:
          - version-update:semver-major
      - dependency-name: mediawiki
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
