---
name: Docker image

# Runs on every pull request, with no path filter: this is a required check, and a required check
# that does not report leaves the pull request unmergeable for good.
#
# Publishing happens only through workflow_call, from release-please.yml and nightly.yml. A push to
# main builds the image and stops: what it is for is exporting the layer cache that smoke.yml,
# translations.yml and pr-preview.yml read, so a pull request does not rebuild from nothing. It
# keeps skipping docs-only changes, which cannot affect the image.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: >-
          The tag to publish this build under, and the only thing that makes this workflow publish
          at all: a release tag (v1.0.0), or a nightly tag (nightly-YYYY-MM-DD).
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # The OIDC token exchanged for a quay.io robot token below. ghcr takes GITHUB_TOKEN instead, so
  # this is the only registry credential in the job, and it lasts an hour.
  id-token: write

# Cancel superseded runs; pushes to main (including release-please's workflow_call) are left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Publishing is this repository, on main, with a tag to publish under: a fork, a pull request
      # and an untagged push to main all build the image and stop there. Every step below that logs
      # in, pushes, or reads a tag back keys off this one value, so they cannot drift apart.
      PUBLISH: >-
        ${{ github.repository_owner == 'chaotic-ground' && github.ref == 'refs/heads/main'
        && inputs.tag != '' }}
      # release-please tags versions v1.2.3, and nightly.yml tags dates nightly-2026-01-01, so the
      # prefix is what tells the two apart before metadata-action tries to read either as a version.
      RELEASE: ${{ startsWith(inputs.tag, 'v') }}
      # Not a secret, only a name: the robot account quay.io federates to this repository's OIDC
      # identity. What it authenticates with is minted per run by the exchange step.
      QUAY_ROBOT: chaotic-ground+wikven_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # quay.io holds no secret of ours. The robot account is federated to this repository's OIDC
      # identity -- issuer token.actions.githubusercontent.com, subject
      # repo:chaotic-ground/wikven:ref:refs/heads/main -- and quay hands back a robot token that
      # expires in an hour. The subject is an exact match, so a run on any other ref gets nothing
      # back; that is the same set of runs PUBLISH already excludes, and a fork gets nothing either
      # way. Nothing to rotate, and nothing to leak from the repository secrets.
      - name: Exchange this run's OIDC token for a quay.io robot token
        id: quay-auth
        if: env.PUBLISH == 'true'
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value)
          echo "::add-mask::$oidc"
          token=$(curl -fsS -u "$QUAY_ROBOT:$oidc" https://quay.io/oauth2/federation/robot/token \
            | jq -er .token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: quay.io
          username: ${{ env.QUAY_ROBOT }}
          password: ${{ steps.quay-auth.outputs.token }}

      # :latest is the newest stable release -- but nothing has been released yet, and a :latest frozen
      # at whatever main last built is worse for a reader than one that still moves. So until v1.0.0
      # ships the nightly carries it, and the handover needs no flag anyone has to remember: the
      # released version lives in .release-please-manifest.json, and the release build checks out the
      # very commit that bumps it.
      - name: Decide whether this build takes :latest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          major=$(jq -er '."."' .release-please-manifest.json | cut -d. -f1)
          if [ "$major" -ge 1 ]; then
            # A stable release takes it. A prerelease (v1.0.0-rc.1) and a nightly do not.
            case "$TAG" in v*-*) latest=false ;; v*) latest=true ;; *) latest=false ;; esac
          else
            case "$TAG" in nightly-*) latest=true ;; *) latest=false ;; esac
          fi
          echo "TAG_LATEST=$latest" >> "$GITHUB_ENV"

      # A release tag becomes the three pinnable version tags. A nightly tag is published verbatim:
      # nightly-2026-01-01 is a date, not a version, and metadata-action's semver patterns cannot
      # read one. metadata-action also emits the org.opencontainers.image.* labels, without
      # which GHCR does not link the published package back to this repository.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # Every tag rule below is multiplied across both images, so one build publishes both
          # registries and the semver logic stays a single copy.
          images: |
            ghcr.io/chaotic-ground/wikven
            quay.io/chaotic-ground/wikven
          # latest is handled explicitly below; the default "auto" keys off a tag push, and releases
          # reach this workflow through workflow_call with the tag as an input instead.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ env.RELEASE }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ env.RELEASE }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ env.RELEASE }}
            type=raw,value=${{ inputs.tag }},enable=${{ startsWith(inputs.tag, 'nightly-') }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}
            # A build that publishes nothing still names its image, so every run is the same shape.
            # Nothing is pushed under this name and nothing outside the job reads it.
            type=raw,value=main,enable=${{ env.PUBLISH != 'true' }}

      - name: Build and push the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: ${{ env.PUBLISH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Layer cache shared with the other image builds, so a PR reuses main's cached layers.
          cache-from: type=gha,scope=wikven-image
          cache-to: type=gha,mode=max,scope=wikven-image

      # A second registry is only worth having if it actually answers, and buildx pushing both in
      # one call does not prove that it did: a push that reached ghcr and not quay would otherwise
      # be a green run, and stay one until a reader hit the dead address. Read every tag back from
      # the registry that now holds it, so half a publish fails here instead.
      - name: Check every published tag answers
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "::group::$tag"
            docker buildx imagetools inspect "$tag"
            echo "::endgroup::"
          done
