---
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/bake-service/**'  # a bake of this site wants a renderer answering
      - 'actions/bake/**'
      - 'docs/**'
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'
  workflow_dispatch:

permissions: {}

# Serialize deployments to the gh-pages branch; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # write the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Whole history: the bake dates each page at the commit that last touched its source
          # file, and a shallow checkout knows only the last one (#406).
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and load this commit's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image
          cache-to: type=gha,mode=max,scope=wikven-image

      # The Charts page draws a real chart, so a bake of this site wants the renderer it names
      # answering. Without one Chart writes an error box where the chart should be and the build
      # succeeds anyway; tests/bake is what refuses that, and only smoke runs it.
      - id: renderer
        uses: $/.github/actions/bake-service
        with:
          name: chart-renderer

      # The Scores page draws real music, which Score renders by sending the command to a Shellbox
      # with LilyPond in it rather than running LilyPond here. See Special:MyLanguage/Scores.
      - id: shellbox
        uses: $/.github/actions/bake-service
        with:
          name: score-shellbox

      # Dogfood the published composite action to bake the docs source.
      - name: Bake the docs site
        uses: $/actions/bake
        with:
          hosts: |
            host.docker.internal=${{ steps.renderer.outputs.address }}
            score-shellbox=${{ steps.shellbox.outputs.address }}
          source: docs
          output: dist
          image: wikven
          cache: false  # the image was just built locally; nothing to cache or pull

      # The whole branch, because it holds this site and nothing else now: the previews live on
      # a branch of their own, and publish-pages lays them over this one. Nothing serves this.
      - name: Store the built site on gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true

  # Serves what the job above stored, with every open pull request's preview beside it.
  publish:
    needs: bake
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write  # publish-pages marks the previews it published as live
    uses: $/.github/workflows/publish-pages.yml
