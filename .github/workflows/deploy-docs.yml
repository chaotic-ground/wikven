---
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'actions/bake/**'
      - 'docs/**'
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'
  workflow_dispatch:

permissions:
  contents: write  # publish the built site to the gh-pages branch

# Serialize deployments to the gh-pages branch; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Whole history: the bake dates each page at the commit that last touched its source
          # file, and a shallow checkout knows only the last one (#406).
          fetch-depth: 0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build and load this commit's image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image
          cache-to: type=gha,mode=max,scope=wikven-image

      # Dogfood the published composite action to bake the docs source.
      - name: Bake the docs site
        uses: ./actions/bake
        with:
          source: docs
          output: dist
          image: wikven
          cache: false  # the image was just built locally; nothing to cache or pull

      # Publish the built site to the root of the gh-pages branch (the repo's Pages source).
      # clean-exclude keeps the pr-preview/ tree that pr-preview.yml manages, so a production
      # deploy never wipes an open PR's preview.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview
