---
name: Updatecli

# The version pins no package manager sees; Dependabot has the rest.
# A pull request opened with GITHUB_TOKEN starts no workflows: close and reopen one to run CI.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  updatecli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: updatecli/updatecli-action@41b9c8d707830a9daebaeaa84c1b62d60b779564  # v3.6.0
        with:
          version: v0.120.1

      - run: updatecli pipeline apply --config updatecli/updatecli.d
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A pin this repository moves by hand does not say what moved. A gitcommit source names the
      # new commit and stops; the notes updatecli embeds for a tagged source cover one release
      # against the one before it, not the span a bump crosses when it skips a version. Either way
      # the compare url is left for the reader to build, and building it needs the pin being
      # replaced -- which no upstream source knows and only this repository holds. So it is worked
      # out here, the pins on main against the pins updatecli pushed, and appended to the body
      # updatecli wrote.
      #
      # No mirror url is written down below. The Dockerfile fetches each tarball from codeload and
      # the site's config names the repository a line above the pin, so every link is read off the
      # same line as the pin it describes and cannot come to name a repository the build does not
      # fetch from. The manifests left out bump a version string with no repository beside it.
      - name: Link each bumped pin to what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # updatecli names each branch after its manifest's pipelineid.
          BRANCHES: updatecli_main_mediawiki-extensions updatecli_main_wikven-repositories
          # The block is written between these, and a later run strips what they hold before
          # writing again, so a pull request updatecli keeps open collects one block and not one
          # per week.
          OPEN: "<!-- wikven: what changed upstream -->"
          CLOSE: "<!-- /wikven -->"
        run: |
          set -euo pipefail

          # "<name> <owner/repo> <pin>", one line per repository pinned by a commit or a tag.
          pins() {
            tree=$1
            sed -n 's/^ARG \([A-Z_]*_VERSION\)=\([0-9a-f]\{40\}\)$/\1=\2/p' "$tree/Dockerfile" |
              while IFS='=' read -r var sha; do
                slug=$(sed -n \
                  "s#.*codeload\.github\.com/\([^/]*/[^/]*\)/tar\.gz/\$$var\b.*#\1#p" \
                  "$tree/Dockerfile" | head -n1)
                [ -n "$slug" ] || continue
                printf '%s %s %s\n' "${slug##*-}" "$slug" "$sha"
              done
            awk '
              /^    [A-Za-z]/ { name = $1; sub(/:$/, "", name); repo = "" }
              /^      repository:/ { repo = $2 }
              /^      (commit|reference):/ && repo != "" {
                slug = repo
                sub(/^https:\/\/github\.com\//, "", slug)
                sub(/\.git$/, "", slug)
                print name, slug, $2
              }
            ' "$tree/docs/.wikven.yaml"
          }

          work=$(mktemp -d)
          pins . | sort > "$work/before.pins"

          link() {
            branch=$1

            if ! gh api "repos/$REPOSITORY/branches/$branch" >/dev/null 2>&1; then
              echo "wikven: updatecli pushed no $branch; nothing to link."
              return 0
            fi

            after=$work/$branch
            mkdir -p "$after/docs"
            for file in Dockerfile docs/.wikven.yaml; do
              gh api "repos/$REPOSITORY/contents/$file?ref=$branch" \
                -H "Accept: application/vnd.github.raw" > "$after/$file"
            done

            pins "$after" | sort > "$work/$branch.pins"
            links=$(join -j 1 -o 0,1.2,1.3,2.3 "$work/before.pins" "$work/$branch.pins" |
              while read -r name slug old new; do
                [ "$old" != "$new" ] || continue
                printf '* [%s](https://github.com/%s/compare/%s...%s)\n' "$name" "$slug" "$old" "$new"
              done)

            if [ -z "$links" ]; then
              echo "wikven: $branch pins what main pins; nothing to link."
              return 0
            fi

            number=$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open \
              --json number --jq '.[0].number // empty')
            if [ -z "$number" ]; then
              echo "wikven: no open pull request for $branch; leaving the links unwritten."
              return 0
            fi

            gh pr view "$number" --repo "$REPOSITORY" --json body --jq .body \
              | awk -v opening="$OPEN" -v closing="$CLOSE" '
                  $0 == opening { skip = 1 } !skip { print } $0 == closing { skip = 0 }
                ' > "$work/$branch.body"
            { printf '%s\n' "$OPEN"; echo; echo "What changed upstream:"; echo
              printf '%s\n' "$links"; echo; printf '%s\n' "$CLOSE"; } >> "$work/$branch.body"
            gh pr edit "$number" --repo "$REPOSITORY" --body-file "$work/$branch.body"
            echo "wikven: linked $(printf '%s\n' "$links" | wc -l) bumped pin(s) on #$number."
          }

          for branch in $BRANCHES; do
            link "$branch"
          done

      # updatecli writes each release's notes into a <pre>, where markdown is text: a heading
      # arrives as its hashes, a link as its brackets. And it writes one <pre> per release the bump
      # crosses, so a pin that skipped a few opens with screens of them. The newest couple are
      # rendered here and the rest dropped, the span they covered being what the compare link above
      # is for.
      - name: Render the release notes a bump brings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # Newest first, so these are the ones a reader wants.
          KEEP: "2"
          # Characters of one release's notes. A body over GitHub's limit is refused, and a project
          # that writes an essay for a release should not cost the pull request the rest of it.
          LIMIT: "8000"
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          for number in $(gh pr list --repo "$REPOSITORY" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("updatecli_main_")) | .number'); do
            gh pr view "$number" --repo "$REPOSITORY" --json body --jq .body > "$work/body"
            awk -v keep="$KEEP" -v limit="$LIMIT" '
              # Every character updatecli escaped on the way in, and no other: the notes are
              # markdown, and a decoder that guessed at more would rewrite what an author wrote.
              function decode(text) {
                gsub(/&#xA;/, "\n", text)
                gsub(/&#x9;/, "\t", text)
                gsub(/&#34;/, "\"", text)
                gsub(/&#39;/, "\047", text)
                gsub(/&quot;/, "\"", text)
                gsub(/&apos;/, "\047", text)
                gsub(/&lt;/, "<", text)
                gsub(/&gt;/, ">", text)
                gsub(/&amp;/, "\\&", text)
                sub(/\n+$/, "", text)
                return text
              }

              function shorten(text,   cut) {
                if (length(text) <= limit) { return text }
                cut = substr(text, 1, limit)
                sub(/\n[^\n]*$/, "", cut)
                return cut "\n\n_(truncated)_"
              }

              BEGIN { keep = keep + 0; limit = limit + 0 }

              /^    <action / { shown = 0; dropped = 0 }

              # One release, as updatecli lays it out: the block, the version, the notes, the close.
              /^            <details>$/ { inblock = 1; version = ""; notes = ""; next }
              inblock && /^                <summary>/ {
                version = $0
                sub(/^ *<summary>/, "", version)
                sub(/<\/summary>$/, "", version)
                next
              }
              inblock && /^                <pre>/ {
                notes = $0
                sub(/^ *<pre>/, "", notes)
                sub(/<\/pre>$/, "", notes)
                next
              }
              inblock && /^            <\/details>$/ {
                inblock = 0
                if (notes == "") { next }
                if (++shown > keep) { dropped++; next }
                # Column zero and a blank line on each side: indent it and GitHub reads the notes
                # as a code block, run it up against the tags and it reads them as more html.
                print "<details>"
                print "<summary>" version "</summary>"
                print ""
                print shorten(decode(notes))
                print ""
                print "</details>"
                next
              }
              inblock { next }

              # Html rather than markdown, because the line after this one is indented and a blank
              # line before it would make that a code block.
              /^        <\/details>$/ && dropped > 0 {
                print "<p><em>" dropped (dropped == 1 ? " older release is" : " older releases are") \
                  " not shown.</em></p>"
                dropped = 0
              }

              { print }
            ' "$work/body" > "$work/rendered"

            if cmp -s "$work/body" "$work/rendered"; then
              echo "wikven: #$number has no notes left to render."
            else
              gh pr edit "$number" --repo "$REPOSITORY" --body-file "$work/rendered"
              echo "wikven: rendered the release notes on #$number."
            fi
          done
