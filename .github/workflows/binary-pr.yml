---
name: Standalone binary

# Path-filtered, so it must stay non-required: a required check that never reports blocks merging.
# Hence `binary`, not `build`: that name is a required context, owned by docker-build.yml.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'binary.Dockerfile'
      - 'bin/build.php'
      - 'caddy/**'
      - '.github/actions/build-binary/action.yml'
      - '.github/workflows/binary-pr.yml'
      - '.github/workflows/build-binary.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-binary
        with:
          arch: x86_64
          cache-from: type=gha,scope=wikven-image
