---
name: Publish pages

# What readers are served, assembled here rather than served off a branch. Two branches hold
# bytes and neither is live: gh-pages is what a push to main baked, previews is what each open
# pull request baked. This lays the second over the first and hands the result to Pages, so each
# branch has one writer and the site being served is an artifact nothing can push to.
#
# It bakes nothing. A pull request's preview costs its own build and this, not a rebuild of a site
# that did not change.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

# The literal name is shared with nothing else, and both callers reach it, so a deploy and a
# preview publish one after the other. Superseding an in-flight one is safe: a later publish reads
# the same two branches, and reads whatever the earlier one was going to.
concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write  # mark the previews this published as live
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # For the git directory alone: what gets published is fetched below, off two branches this
      # never checks out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: previews
        name: Lay the previews over the site
        run: |
          set -euo pipefail
          # Before the fetch: a preview recorded earlier than this is in what gets published.
          echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Into a work tree of its own, so the checkout above stays where it is. Shallow: only
          # the tip of each is published, and the history of a built site is nobody's to read.
          git fetch --quiet --depth 1 origin gh-pages
          git --work-tree=dist checkout --quiet FETCH_HEAD -- .
          # Absent until the first pull request of the repository's life, and empty whenever none
          # is open: the action that tears a preview down leaves the branch rather than deleting
          # it. Both are the ordinary state of a repository with nothing in review, and `checkout
          # -- .` against a tree with nothing in it is an error, so neither reaches it.
          if ! git fetch --quiet --depth 1 origin previews 2>/dev/null; then
            echo "wikven: no previews branch yet; publishing the site alone."
          elif [ -z "$(git ls-tree FETCH_HEAD)" ]; then
            echo "wikven: no pull request has a preview open; publishing the site alone."
          else
            git --work-tree=dist checkout --quiet FETCH_HEAD -- .
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # pr-preview.yml records each preview in_progress, since storing it serves nothing. Now that
      # Pages holds what was fetched above, those recorded before the fetch are live (#811). One
      # cancelled by a later publish is left for that publish, which fetched no less.
      - name: Mark the published previews as live
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          LAID_AT: ${{ steps.previews.outputs.at }}
        with:
          script: |
            // Newest first; one older than the latest hundred has long been published or closed.
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo,
              environment: 'preview',
              per_page: 100,
            });
            for (const deployment of deployments) {
              if (deployment.created_at > process.env.LAID_AT) continue;
              const { data: [status] } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo,
                deployment_id: deployment.id,
                per_page: 1,
              });
              if (status?.state !== 'in_progress') continue;
              const number = deployment.payload.number;
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: 'success',
                environment_url: `https://${context.repo.owner}.github.io/`
                  + `${context.repo.repo}/pr-preview/pr-${number}/`,
                auto_inactive: false,
                description: 'Preview is live',
              });
            }
