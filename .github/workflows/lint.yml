---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# biome is installed by hand, mago via our own action: upstream setup-* actions spend two REST
# calls per run on a fixed download URL and cache nothing, draining the shared 1,000/hour budget.

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: |
          v=$(sed -n 's#.*biomejs\.dev/schemas/\([^/]*\)/.*#\1#p' biome.json)
          if [ -z "$v" ]; then
            echo "::error file=biome.json::could not read a version from the \$schema URL"
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin/biome
          key: biome-${{ runner.os }}-${{ steps.version.outputs.v }}

      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          BIOME_VERSION: ${{ steps.version.outputs.v }}
        run: |
          base=https://github.com/biomejs/biome/releases/download
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/biome" "$base/@biomejs/biome@${BIOME_VERSION}/biome-linux-x64"
          mkdir -p ~/.local/bin
          mv "$tmp/biome" ~/.local/bin/biome

      - run: |
          chmod +x ~/.local/bin/biome
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: biome ci

  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: rvben/rumdl@0ac9bfbb1421d5acf0283c46ba09ae46699e2fda  # v0.2.53

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91  # v2
        with:
          version: "0.10.0"
      - run: taplo fmt --check
      - run: taplo check

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv run --frozen --group lint yamllint --strict .

  mago:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      # mago.toml extends the shared style config installed under vendor/, so install it first.
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast

      - uses: chaotic-ground/setup-mago@d79272ad1380980e87ff0c7da01b7131ccb0083b  # v1.1.0

      - run: mago format --check
      - run: mago lint

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f  # v1.49.0

  # MediaWiki coding-standard checks mago doesn't cover: docs, naming, and forbidden patterns.
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          # Lint tools (codesniffer, grumphp, minus-x) need PHP >= 8.2; just the runner, not wikven's target.
          php-version: "8.3"
          tools: composer
      # mediawiki-phan-config pulls in phan (needs ext-ast); phpcs doesn't, so ignore that platform req.
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast
      - run: composer phpcs

  # Documentation the code has outgrown reads as documentation, which is worse than none: every
  # check here is drift that has actually happened, turned into a gate. The two that carry an
  # allowlist carry one rather than a pattern, so a new entry is a decision someone makes rather
  # than a silence someone inherits.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Every configuration variable extension.json declares is one a site author can set, and
      # docs/Configuration.wikitext is where they look it up. Six of them had never reached that
      # page. The three skipped are derived from WIKVEN_WORKDIR by the build and are documented
      # there as ones not to set.
      - name: Check every configuration variable is documented
        run: |
          set -euo pipefail
          internal="WikvenSourceDirectory WikvenHtmlDirectory WikvenSourceHistoryFile"
          status=0
          for key in $(jq -r '.config | keys[]' extension.json); do
            case " $internal " in
              *" $key "*) continue ;;
            esac
            if ! grep -qF "$key" docs/Configuration.wikitext; then
              echo "::error file=docs/Configuration.wikitext::$key is declared in extension.json" \
                   "but not documented here. Document it, or add it to the internal list in" \
                   ".github/workflows/lint.yml if the build sets it itself."
              status=1
            fi
          done
          exit "$status"

      # Every maintenance script is a build step, and the pipeline is described in
      # docs/Development.wikitext. The four translation helpers are documented by the command that
      # runs them (translate mark/scaffold/stamp/check) rather than by file name, so they are named
      # here instead.
      - name: Check every build step is documented
        run: |
          set -euo pipefail
          helpers="markTranslations scaffoldTranslations stampTranslations checkTranslations"
          status=0
          for script in maintenance/*.php; do
            step=$(basename "$script" .php)
            case " $helpers " in
              *" $step "*) continue ;;
            esac
            if ! grep -qrF "$step" docs/*.wikitext; then
              echo "::error file=$script::$step is a build step no page under docs/ mentions." \
                   "Describe it in docs/Development.wikitext, or add it to the helper list in" \
                   ".github/workflows/lint.yml if it is documented by command name."
              status=1
            fi
          done
          exit "$status"

      # The documentation pages are a sequence, and the sequence was written down twice: as the
      # order of docs/MediaWiki:Sidebar.wikitext, and as the arguments of the {{prevnext}} call at
      # the bottom of each page. The two had already drifted (#455): three pages reached the sidebar
      # without ever being wired into the chain, so a reader following it arrived at a page with no
      # navigation on it at all. Adding a page means editing the sidebar, the new page and the page
      # before it, and forgetting the third was invisible.
      #
      # The sidebar is the order of record because it is the one that cannot read the other: the
      # skin parses it line by line, so it holds no template that would expand into entries. This
      # derives the call each page should carry from it and compares, which leaves the order stated
      # twice but no longer unwatched. Deriving the calls themselves would need string work no
      # parser function does, and the two ways to get it -- a Lua module, or a build step writing a
      # lookup page -- cost a Scribunto engine the standalone binary cannot carry, or a wikven
      # feature that exists for this site alone. See the issue for both.
      - name: Check every prevnext follows the sidebar order
        run: |
          set -euo pipefail
          # The order of record, read as the skin reads it: one page per "**" entry, with the
          # Special:MyLanguage/ prefix and the |message-key label cut off. index heads the chain
          # without being an entry -- the sidebar names it through mainpage, and every skin's logo
          # leads there -- so it is prepended.
          chain=(index)
          while IFS= read -r page; do
            chain+=("$page")
          done < <(sed -n 's#^\*\* Special:MyLanguage/\([^|]*\)|.*#\1#p' docs/MediaWiki:Sidebar.wikitext)
          if [ "${#chain[@]}" -lt 3 ]; then
            echo "::error file=docs/MediaWiki:Sidebar.wikitext::no page entries read from the sidebar."
            exit 1
          fi
          last=$(( ${#chain[@]} - 1 ))
          status=0
          for i in "${!chain[@]}"; do
            page=${chain[i]}
            file="docs/$page.wikitext"
            if [ ! -f "$file" ]; then
              echo "::error file=docs/MediaWiki:Sidebar.wikitext::the sidebar lists $page, which has" \
                   "no page under docs/. Add docs/$page.wikitext, or drop the entry."
              status=1
              continue
            fi
            # Which form the position takes: the last page names prev=, since no positional form
            # spells a previous with no next; the others pass positional arguments, the next being
            # the last of them. The first sidebar page has a next alone too, because what precedes
            # it is index, which readers reach from the logo rather than from the chain.
            if [ "$i" -eq "$last" ]; then
              want="{{prevnext|prev=${chain[i - 1]}}}"
            elif [ "$i" -le 1 ]; then
              want="{{prevnext|${chain[i + 1]}}}"
            else
              want="{{prevnext|${chain[i - 1]}|${chain[i + 1]}}}"
            fi
            got=$(grep -F '{{prevnext' "$file" || true)
            if [ "$got" != "$want" ]; then
              echo "::error file=$file::MediaWiki:Sidebar puts this page where its navigation should" \
                   "read $want, and it reads ${got:-nothing}. Fix whichever of the two is wrong."
              status=1
            fi
          done
          # Navigation on a page the sidebar leaves out points along a sequence it is not part of.
          for file in docs/*.wikitext; do
            page=$(basename "$file" .wikitext)
            case "$page" in Template:*) continue ;; esac
            if grep -qF '{{prevnext' "$file" && ! printf '%s\n' "${chain[@]}" | grep -qxF "$page"; then
              echo "::error file=$file::this page has bottom navigation but is not in" \
                   "MediaWiki:Sidebar. List it there, or drop the call."
              status=1
            fi
          done
          exit "$status"

  # "composer test" is minus-x, which checks file modes and shebangs and needs no wiki around it.
  # It ran as a quibble stage, which spent 100 seconds booting MediaWiki to reach a check that
  # reads the working tree. Keeping the job name keeps the required check.
  composer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast
      - run: composer test
