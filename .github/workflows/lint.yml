---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# biome is installed by hand, mago via our own action: upstream setup-* actions spend two REST
# calls per run on a fixed download URL and cache nothing, draining the shared 1,000/hour budget.

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: |
          v=$(sed -n 's#.*biomejs\.dev/schemas/\([^/]*\)/.*#\1#p' biome.json)
          if [ -z "$v" ]; then
            echo "::error file=biome.json::could not read a version from the \$schema URL"
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin/biome
          key: biome-${{ runner.os }}-${{ steps.version.outputs.v }}

      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          BIOME_VERSION: ${{ steps.version.outputs.v }}
        run: |
          base=https://github.com/biomejs/biome/releases/download
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/biome" "$base/@biomejs/biome@${BIOME_VERSION}/biome-linux-x64"
          mkdir -p ~/.local/bin
          mv "$tmp/biome" ~/.local/bin/biome

      - run: |
          chmod +x ~/.local/bin/biome
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: biome ci

  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f  # v0.2.55

  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91  # v2
        with:
          version: "0.10.0"
      - run: taplo fmt --check
      - run: taplo check

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv run --frozen --group lint yamllint --strict .

  mago:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      # mago.toml extends the shared style config installed under vendor/, so install it first.
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast

      - uses: chaotic-ground/setup-mago@d79272ad1380980e87ff0c7da01b7131ccb0083b  # v1.1.0

      - run: mago format --check
      - run: mago lint

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f  # v1.49.0

  # MediaWiki coding-standard checks mago doesn't cover: docs, naming, and forbidden patterns.
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          # Lint tools (codesniffer, grumphp, minus-x) need PHP >= 8.2; just the runner, not wikven's target.
          php-version: "8.3"
          tools: composer
      # mediawiki-phan-config pulls in phan (needs ext-ast); phpcs doesn't, so ignore that platform req.
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast
      - run: composer phpcs

  # Documentation the code has outgrown reads as documentation, which is worse than none: the two
  # checks here are the drift that has actually happened, turned into a gate. Both carry an
  # allowlist rather than a pattern, so a new entry is a decision someone makes rather than a
  # silence someone inherits.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Every configuration variable extension.json declares is one a site author can set, and
      # docs/Configuration.wikitext is where they look it up. Six of them had never reached that
      # page. The three skipped are derived from WIKVEN_WORKDIR by the build and are documented
      # there as ones not to set.
      - name: Check every configuration variable is documented
        run: |
          set -euo pipefail
          internal="WikvenSourceDirectory WikvenHtmlDirectory WikvenSourceHistoryFile"
          status=0
          for key in $(jq -r '.config | keys[]' extension.json); do
            case " $internal " in
              *" $key "*) continue ;;
            esac
            if ! grep -qF "$key" docs/Configuration.wikitext; then
              echo "::error file=docs/Configuration.wikitext::$key is declared in extension.json" \
                   "but not documented here. Document it, or add it to the internal list in" \
                   ".github/workflows/lint.yml if the build sets it itself."
              status=1
            fi
          done
          exit "$status"

      # The MediaWiki this is built on is named in half a dozen places -- the two CI matrices,
      # updatecli's extension branches, the branch-protection ruleset, extension.json's floor, and
      # the pages that tell an author what they are writing against -- and a bump that reaches only
      # some of them is silent: the image carries a release CI never tests, or the promise and the
      # docs describe a version nobody ships. The Dockerfile's tag decides what a site actually
      # runs, so it is what the rest is checked against.
      - name: Check every file agrees on which MediaWiki this is
        run: |
          set -euo pipefail
          version=$(sed -n 's/^FROM mediawiki:\([0-9][0-9]*\.[0-9][0-9]*\)\..*/\1/p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::no 'FROM mediawiki:<major>.<minor>.<patch>' line to read the version from."
            exit 1
          fi
          branch="REL${version/./_}"
          status=0

          # The floor a site reads, against the release it is actually handed.
          declared=$(jq -r '.requires.MediaWiki' extension.json)
          if [ "$declared" != ">= $version.0" ]; then
            echo "::error file=extension.json::requires.MediaWiki is \"$declared\", but the image is built on" \
                 "MediaWiki $version. It should be \">= $version.0\"."
            status=1
          fi

          # Anything still naming another release branch is a file the last bump did not reach.
          # docs/ is left out: a page naming a branch is illustrating what a pin looks like, not
          # holding one, and an example is free to name whichever branch reads best.
          stray=$(grep -rn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules \
                    --exclude-dir=docs -oE 'REL1_[0-9]+' . | grep -v ":$branch$" || true)
          if [ -n "$stray" ]; then
            echo "$stray"
            echo "::error::the lines above name a MediaWiki release branch other than $branch," \
                 "which is what the Dockerfile is built on."
            status=1
          fi

          # The pages that tell a site author and an extension author what they are writing against.
          for page in docs/Installation.wikitext "docs/Writing an extension.wikitext"; do
            if ! grep -qF "$version" "$page"; then
              echo "::error file=$page::this page says which MediaWiki {{SITENAME}} runs on and no" \
                   "longer names $version."
              status=1
            fi
          done
          exit "$status"

      # Every maintenance script is a build step, and the pipeline is described in
      # docs/Development.wikitext. The four translation helpers are documented by the command that
      # runs them (translate mark/scaffold/stamp/check) rather than by file name, so they are named
      # here instead.
      - name: Check every build step is documented
        run: |
          set -euo pipefail
          helpers="markTranslations scaffoldTranslations stampTranslations checkTranslations"
          status=0
          for script in maintenance/*.php; do
            step=$(basename "$script" .php)
            case " $helpers " in
              *" $step "*) continue ;;
            esac
            if ! grep -qrF "$step" docs/*.wikitext; then
              echo "::error file=$script::$step is a build step no page under docs/ mentions." \
                   "Describe it in docs/Development.wikitext, or add it to the helper list in" \
                   ".github/workflows/lint.yml if it is documented by command name."
              status=1
            fi
          done
          exit "$status"

  # "composer test" is minus-x, which checks file modes and shebangs and needs no wiki around it.
  # It ran as a quibble stage, which spent 100 seconds booting MediaWiki to reach a check that
  # reads the working tree. Keeping the job name keeps the required check.
  composer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast
      - run: composer test
