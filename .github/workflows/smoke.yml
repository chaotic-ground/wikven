---
name: Smoke test

# Bake the docs source with the real image and assert the output is a complete,
# self-contained site. The unit suite covers only helper classes, so without
# this a regression anywhere in the bake pipeline (maintenance/, AssetLocalizer,
# hooks, Dockerfile) would produce a broken site yet pass every other gate.
# Runs on every pull request, with no path filter: this is a required check, and a required check
# that does not report leaves the pull request unmergeable for good. Pushes to main stay filtered,
# since a change outside these paths cannot alter the bake.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'
      - 'docs/**'
      - '.github/workflows/smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
  pull_request:

permissions:
  contents: read

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Reads the layer cache docker-build.yml writes. Three jobs build this image per pull request;
      # only that one exports, since concurrent mode=max writers each upload the whole cache to
      # overwrite one another, and a reader gets the same layers either way.
      - name: Build and load the wikven image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image

      - name: Bake the docs site
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$(pwd)/docs:/workspace/src" \
            -v "$(pwd)/dist:/workspace/dist" \
            wikven

      - name: Assert the bake produced a complete, self-contained site
        run: |
          set -euo pipefail
          # The main page must land at the dist root (a failed import already aborted the build).
          test -s dist/index.html

          # Dumped CSS must not reference load.php (a live-only endpoint); a leftover is an AssetLocalizer regression.
          if grep -rIl --include='*.css' 'load\.php' dist; then
            echo "::error::dumped CSS still references load.php (AssetLocalizer regression)"
            exit 1
          fi

          # Bundled webfonts. The Khmer translation is the fixture: without a page in a script ULS
          # has a font for, every assertion below passes vacuously on an empty stylesheet.
          test -s dist/webfonts.css
          grep -q ':lang(km)' dist/webfonts.css
          ls dist/fonts/uls/KhmerOSbattambang/*.woff2 >/dev/null

          # Every url() must resolve from the stylesheet's own directory, which is what lets the
          # fonts load from a page at any depth.
          grep -o "url('[^']*')" dist/webfonts.css | sed "s/^url('//;s/')$//" | sort -u \
            | while read -r ref; do
                test -f "dist/$ref" || { echo "::error::webfonts.css references missing $ref"; exit 1; }
              done

          # Every <languages/> bar lists every language the source has (#333 baked them short).
          # A page with N languages is emitted N+1 times and each copy carries N entries, so the
          # target is derived from the source tree rather than pinned to a number.
          expected=0
          for f in docs/*.wikitext; do
            grep -q '<languages */>' "$f" || continue
            base=$(basename "$f" .wikitext)
            langs=1
            if [ -d "docs/$base" ]; then
              langs=$(( langs + $(ls "docs/$base"/*.wikitext 2>/dev/null | wc -l) ))
            fi
            expected=$(( expected + langs * ( langs + 1 ) ))
          done
          # Once per skin the site renders: the default plus the one docs/.wikven.yml adds.
          expected=$(( expected * 2 ))
          found=$(find dist -name '*.html' -exec grep -ho 'mw-pt-progress--' {} + | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::$found language-bar entries across dist, expected $expected"
            exit 1
          fi

          echo "Smoke checks passed."

      # Node.js is preinstalled on the runner; no setup-node (its caching trips
      # the cache-poisoning audit, and this job shares a build cache with the
      # image-publishing workflow).
      - name: Install the browser test tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The static server and its readiness check live in playwright.config.js (webServer), so the
      # same command works on a developer's machine too.
      - name: Assert the rendered site in a browser
        env:
          WIKVEN_BASE_URL: http://127.0.0.1:8080/wikven/
        run: npm run test:e2e
