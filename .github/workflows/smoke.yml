---
name: Smoke test

# Bake the docs source with the real image and assert the output is a complete,
# self-contained site. The unit suite covers only helper classes, so without
# this a regression anywhere in the bake pipeline (maintenance/, AssetLocalizer,
# hooks, Dockerfile) would produce a broken site yet pass every other gate.
# Runs on every pull request, with no path filter: this is a required check, and a required check
# that does not report leaves the pull request unmergeable for good. Pushes to main stay filtered,
# since a change outside these paths cannot alter the bake.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'
      - 'docs/**'
      - '.github/workflows/smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/bake/**'
      - 'tests/e2e/**'
  pull_request:

permissions:
  contents: read

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Every job in this repository carries one of these: a runner that stops answering otherwise
    # waits out GitHub's six-hour default before anybody is told anything.
    #
    # Three times what the job takes -- around ten minutes, two bakes and a browser install -- so a
    # stall is reported in minutes while a slow but healthy run never trips it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Reads the layer cache docker-image.yml writes. Three jobs build this image per pull request;
      # only that one exports, since concurrent mode=max writers each upload the whole cache to
      # overwrite one another, and a reader gets the same layers either way.
      - name: Build and load the wikven image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image

      # The trees WikvenRepositories pins, kept from one run to the next. A bake clones them from
      # other people's servers, and asking those four hosts for the same immutable tags on every
      # push is not what their logs are for (#716). Only the first bake below is given them: the
      # second still clones cold, so every push exercises the fetch, and the reproducibility check
      # this job already runs compares a bake off the kept trees against a bake off fresh ones. The
      # key holds the pins and the code that reads them, so changing either clones cold on both.
      #
      # zizmor reads a cache beside a docker build as something a release could be built from. This
      # job publishes nothing -- the image is loaded, not pushed -- and a cache written on a pull
      # request's ref is not one a run on main can read, so an entry a fork writes reaches its own
      # bake and nothing else. The marker sits on path: rather than on the uses: line, whose comment
      # is the pinned version and dependabot's to rewrite, and it covers this step alone: a cache
      # added to this workflow later is reported like any other.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/wikven/fetch  # zizmor: ignore[cache-poisoning]
          key: >-
            wikven-fetch-${{ hashFiles('docs/.wikven.yaml',
            'maintenance/fetchExtensions.php', 'includes/Fetching/**') }}

      # Both bakes of the reproducibility check below, at once. They are independent by construction
      # -- separate containers, separate output directories, one shared source -- and most of a
      # bake is a single process: only the skin passes run beside each other, so the second bake
      # fills cores the first leaves idle rather than taking any from it. Measured on four cores, the
      # runner's count: 257s one after the other against 150s together, output byte-identical either
      # way, and a combined 1 GiB at peak where the runner has 16.
      #
      # Each writes to its own log because two live logs interleave into neither.
      - name: Bake the docs site twice
        run: |
          set -uo pipefail
          mkdir -p dist dist-again "$HOME/.cache/wikven/fetch"
          bake() {
            docker run --rm \
              -v "$(pwd)/docs:/workspace/src:ro" \
              -v "$(pwd)/$1:/workspace/dist" \
              "${@:2}" \
              wikven
          }
          bake dist -v "$HOME/.cache/wikven/fetch:/workspace/fetch" \
            -e WIKVEN_FETCH_DIR=/workspace/fetch > bake.log 2>&1 &
          first=$!
          bake dist-again > bake-again.log 2>&1 &
          second=$!
          status=0
          wait "$first" || status=$?
          wait "$second" || status=$?
          echo '::group::First bake'
          cat bake.log
          echo '::endgroup::'
          echo '::group::Second bake'
          cat bake-again.log
          echo '::endgroup::'
          exit "$status"

      # What a finished site has to be true of is written down in tests/bake/, one Python function
      # per fact, against expectations tests/bake/docs.toml holds for this site. It used to be 471
      # lines of shell and embedded Python in this file, which meant the only way to run it was to
      # push: changing one check in #663 took parsing this workflow's YAML and extracting the
      # heredoc back out to a file, to run it against two bakes that were already on disk.
      #
      # A contributor with a bake runs the same checks with `composer test:bake`. What is added here
      # is only what a runner has and a laptop does not: the logs the two bakes wrote, the second
      # bake for the checks that compare the pair, and --github, which turns each problem into an
      # annotation. The checks themselves emit no workflow commands, so they read the same either
      # way.
      #
      # Spelled out rather than run through the composer script it mirrors: composer prints its own
      # banner over the report, and silencing that with --quiet silences the report with it.
      - name: Assert the bake produced a complete, self-contained site
        run: |
          php tests/bake/assert-bake.php \
            --expect tests/bake/docs.php --source docs \
            --log bake.log --log bake-again.log \
            --compare-with dist-again \
            --github dist

      # Two bakes of the same source have to produce the same bytes, and until now nothing said so.
      # Everything in the bake that exists for it -- the frozen clock and SOURCE_DATE_EPOCH, the
      # frozen page_touched, the fifo job queue, the disabled NewPP limit report, the PNG timestamp
      # chunks stripped on import, the installer's main page deleted -- was written after someone
      # noticed the output moving between bakes, so the next regression was going to be found the
      # same way (#411).
      #
      # A preview is a claim that what you see is what you will publish, so what it answers is
      # worth an assertion of its own. It serves the files the export contains and nothing else: an
      # address the site does not have is a 404 rather than the front page, and a directory is
      # redirected onto its trailing slash, without which the page's own relative links resolve one
      # level too high and load another skin's copy of a stylesheet (#640).
      - name: Assert the preview serves the export and nothing else
        run: |
          set -euo pipefail
          docker run --rm -d --name wikven-preview -p 8090:8080 \
            -v "$(pwd)/dist:/workspace/dist:ro" wikven serve > /dev/null
          trap 'docker rm -f wikven-preview > /dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8090/index.html && break
            sleep 1
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090$1"; }
          expect() {
            got=$(status "$1")
            if [ "$got" != "$2" ]; then
              echo "::error::preview answered $got for $1, expected $2"
              exit 1
            fi
          }
          expect / 200
          expect /Development.html 200
          expect /citizen/ 200
          # A directory has to be redirected, not served where it was asked for.
          expect /citizen 301
          # Not the export's, so not the preview's to invent or to answer.
          expect /Development 404
          expect /assets/ 404
          expect /nothing-is-here 404
          expect /nothing-is-here/deeper 404
          echo 'the preview serves the export and answers 404 for the rest'

      # Same checkout, same image, same runner, so the bake itself is the only thing that can
      # differ. Baking from two separate clones is the stronger check and is not this one: it fails
      # today because importWikitext.php stamps revisions with filemtime(), which a second clone
      # changes (#406).
      #
      # Both bakes ran in the step above, at once; this only reads what they wrote.
      - name: Assert the two bakes are identical
        run: |
          set -euo pipefail
          if diff -rq dist dist-again; then
            echo "Two bakes of the same source are byte-identical."
          else
            echo "::error::two bakes of the same source are not identical (#411)"
            # The file list above says which pages moved; this says what moved in them, and is cut
            # off because a single differing byte in a shared header differs in every page.
            diff -r dist dist-again | head -n 200 || true
            exit 1
          fi

      # Node.js is preinstalled on the runner; no setup-node, whose caching trips the
      # cache-poisoning audit. Nothing this job does can reach a release on its own: it reads the
      # wikven-image layer cache and writes nothing, and a released binary builds from its own
      # per-architecture scope rather than that one. But the scope it reads is written by the job
      # that publishes the image, so a cache added here is one more entry for that audit to weigh.
      # At nine seconds for npm ci and the browser together, there is nothing worth buying with it.
      # The headless shell, not all of "chromium". Asking for chromium fetches Chrome for Testing
      # (379 MiB unpacked) as well as the shell (262 MiB), and these specs never start the former:
      # they run headless, which is what the shell is. ffmpeg (5 MiB) comes along either way, so what
      # this saves is the 379 MiB.
      #
      # And no --with-deps, which is the apt call. The runner image already carries Google Chrome,
      # Chromium, Edge and Firefox as installed packages, so the shared libraries the shell wants are
      # on the machine before we ask for anything, and an apt call is a mirror that is not ours on a
      # path we do not need.
      #
      # If either half were ever not enough -- a spec asking for a headed browser, or a library the
      # image stops shipping -- Playwright says which executable or which .so it cannot find, so this
      # cannot quietly test the wrong thing.
      - name: Install the browser test tooling
        run: |
          npm ci
          npx playwright install chromium-headless-shell

      # The static server and its readiness check live in playwright.config.js (webServer), so the
      # same command works on a developer's machine too.
      - name: Assert the rendered site in a browser
        env:
          WIKVEN_BASE_URL: http://127.0.0.1:8080/wikven/
        run: npm run test:e2e
