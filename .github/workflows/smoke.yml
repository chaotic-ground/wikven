---
name: Smoke test

# Bake the docs source with the real image and assert the output is a complete,
# self-contained site. The unit suite covers only helper classes, so without
# this a regression anywhere in the bake pipeline (maintenance/, AssetLocalizer,
# hooks, Dockerfile) would produce a broken site yet pass every other gate.
# Runs on every pull request, with no path filter: this is a required check, and a required check
# that does not report leaves the pull request unmergeable for good. Pushes to main stay filtered,
# since a change outside these paths cannot alter the bake.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'
      - 'docs/**'
      - '.github/workflows/smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
  pull_request:

permissions:
  contents: read

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Every job in this repository carries one of these, and this is the job that earned them. On
    # 2026-08-18 the runner's Ubuntu mirror stopped answering during `playwright install
    # --with-deps`; apt fell back to archive.ubuntu.com, fetched the release files and then sat
    # there. With no timeout the job waited out GitHub's six-hour default before anyone was told
    # anything. The mirror is not ours to fix; how long we wait to hear about it is.
    #
    # Three times what the job takes -- around ten minutes, two bakes and a browser install -- so a
    # stall is reported in minutes while a slow but healthy run never trips it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Reads the layer cache docker-image.yml writes. Three jobs build this image per pull request;
      # only that one exports, since concurrent mode=max writers each upload the whole cache to
      # overwrite one another, and a reader gets the same layers either way.
      - name: Build and load the wikven image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image

      # Both bakes of the reproducibility check below, at once. They are independent by construction
      # -- separate containers, separate output directories, one shared source -- and most of a
      # bake is a single process: only the skin passes run beside each other, so the second bake
      # fills cores the first leaves idle rather than taking any from it. Measured on four cores, the
      # runner's count: 257s one after the other against 150s together, output byte-identical either
      # way, and a combined 1 GiB at peak where the runner has 16.
      #
      # Each writes to its own log because two live logs interleave into neither.
      - name: Bake the docs site twice
        run: |
          set -uo pipefail
          mkdir -p dist dist-again
          bake() {
            docker run --rm \
              -v "$(pwd)/docs:/workspace/src:ro" \
              -v "$(pwd)/$1:/workspace/dist" \
              wikven
          }
          bake dist > bake.log 2>&1 &
          first=$!
          bake dist-again > bake-again.log 2>&1 &
          second=$!
          status=0
          wait "$first" || status=$?
          wait "$second" || status=$?
          echo '::group::First bake'
          cat bake.log
          echo '::endgroup::'
          echo '::group::Second bake'
          cat bake-again.log
          echo '::endgroup::'
          exit "$status"

      - name: Assert the bake produced a complete, self-contained site
        run: |
          set -euo pipefail
          # The main page must land at the dist root (a failed import already aborted the build).
          test -s dist/index.html

          # Dumped CSS must not reference load.php (a live-only endpoint); a leftover is an AssetLocalizer regression.
          if grep -rIl --include='*.css' 'load\.php' dist; then
            echo "::error::dumped CSS still references load.php (AssetLocalizer regression)"
            exit 1
          fi

          # The export has no Special:Search, so a link to it answers 404 (#393). Vector writes one
          # for the collapsed search box, on every page it renders, and the results page is where
          # that belongs; the hidden "title" input naming the special page is left to SifterSearch,
          # which repoints it, so this matches the link alone.
          if grep -rIl --include='*.html' 'Special:Search\.html' dist; then
            echo "::error::exported HTML links to Special:Search, which the export does not have"
            exit 1
          fi

          # A skin copy reads the search index out of its own directory, which is what keeps a
          # search from the skin a reader chose inside that skin's copy (#399). The bundle is put
          # there by the skin pass; without it the copy's search answers nothing at all, and only
          # the browser tests would notice.
          test -s dist/pagefind/pagefind.js
          for copy in citizen minerva; do
            if [ ! -s "dist/$copy/pagefind/pagefind.js" ]; then
              echo "::error::dist/$copy has no Pagefind bundle of its own"
              exit 1
            fi
          done

          # Each page is indexed in the language it is written in, so Pagefind builds one index per
          # language and a reader searching from a translated page is answered out of that
          # language's index (#400). A single index means every translation was stamped with the
          # wiki's content language and stemmed by English rules, which is what this site looked
          # like until SifterSearch indexed per page rather than per wiki.
          echo "Search indexes built:"
          ls dist/pagefind/*.pf_meta | xargs -n1 basename
          echo "Indexed pages per language:"
          ls dist/pagefind/fragment | sed 's/_.*//' | sort | uniq -c
          for lang in en ko; do
            if ! ls dist/pagefind/pagefind."${lang}"_*.pf_meta >/dev/null 2>&1; then
              echo "::error::dist/pagefind has no $lang index; pages are not indexed in their own language"
              exit 1
            fi
          done

          # Marking a page for translation gives it a translation page in the source language too,
          # so "Installation" and "Installation/en" hold the same English text under two titles and
          # English was counted twice for every translated page (#454). Only the source page is
          # indexed now, and what says so is the absence of any "/en.html" from the English index --
          # a count would not, since the pages indexed are not the source files: the build generates
          # Settings, which has no file, and the search results page has a file but is not indexed.
          # Those two cancelled out the day this was written, so a count read off the source tree
          # would have passed by luck and broken on the next page added.
          #
          # This reads Pagefind's fragments, which are gzipped JSON carrying the page's url.
          if for f in dist/pagefind/fragment/en_*; do
               gzip -dc "$f" 2>/dev/null || cat "$f"
             done | grep -q '"url":"[^"]*/en\.html"'; then
            echo "::error::the en index holds a /en.html page, which restates its source page"
            echo "::error::a source-language translation page is being indexed beside its source"
            exit 1
          fi

          # A sortable table needs jquery.tablesorter, and core does not queue it while rendering:
          # mediawiki.page.ready looks for table.sortable in the browser and fetches the module from
          # load.php, which an export does not have (#483). The build makes that decision instead, so
          # what this checks is that it made it -- the module has to be in the bundle, and the page
          # that asked for it has to still be there to ask.
          if ! grep -q 'class="[^"]*\bsortable\b' dist/Licenses.html; then
            echo "::error::dist/Licenses.html no longer has a sortable table for this to be about"
            exit 1
          fi
          if ! grep -q 'jquery.tablesorter' dist/modules-static.js; then
            echo "::error::a page has a sortable table and jquery.tablesorter is not in the bundle"
            echo "::error::the table will publish with headers that do nothing"
            exit 1
          fi

          # A Lua module runs at build time and its answer is baked into the page that invoked it
          # (#465). Module:Example answers with the title of the page it ran on, so this says both
          # that Scribunto rendered at all -- without it the invocation is left in the page as
          # "{{#invoke:Example|thisPage}}", which is what used to happen quietly -- and that the
          # module saw which page it was on, per language.
          # Spelled out per language rather than looped, because the file name has underscores where
          # the title the module answers with has spaces.
          if ! grep -q '<code>Lua modules</code>' dist/Lua_modules.html; then
            echo "::error::dist/Lua_modules.html does not carry Module:Example's answer"
            exit 1
          fi
          if ! grep -q '<code>Lua modules/ko</code>' dist/Lua_modules/ko.html; then
            echo "::error::dist/Lua_modules/ko.html does not carry Module:Example's answer for Korean"
            exit 1
          fi

          # And the module itself is not a page of the site: Module: is not a content namespace, so
          # nothing should export the Lua source. Without Scribunto it does, percent-encoded.
          if ls dist/Module* >/dev/null 2>&1; then
            echo "::error::the Lua module was exported as a page:"
            ls dist/Module*
            exit 1
          fi

          # Every printfooter "Retrieved from" link must resolve from the page that carries it
          # (#394). Core builds it from the page's own URL and expands away the "./" wikven writes,
          # so a page exported into a subdirectory needs the "../" per level rename.php adds; the
          # link is print-only on screen, which is exactly why nothing else would catch it.
          find dist -name '*.html' -print0 | while IFS= read -r -d '' page; do
            href=$(sed -n 's/.*class="printfooter"[^<]*<a[^>]*href="\([^"]*\)".*/\1/p' "$page")
            [ -n "$href" ] || continue
            case "$href" in *'://'* | /* | '#'*) continue ;; esac
            if [ ! -f "$(dirname "$page")/$href" ]; then
              echo "::error::$page: printfooter link '$href' does not resolve"
              exit 1
            fi
          done

          # Bundled webfonts. The Khmer translation is the fixture: without a page in a script ULS
          # has a font for, every assertion below passes vacuously on an empty stylesheet.
          test -s dist/webfonts.css
          grep -q ':lang(km)' dist/webfonts.css
          ls dist/fonts/uls/KhmerOSbattambang/*.woff2 >/dev/null

          # Every url() must resolve from the stylesheet's own directory, which is what lets the
          # fonts load from a page at any depth.
          grep -o "url('[^']*')" dist/webfonts.css | sed "s/^url('//;s/')$//" | sort -u \
            | while read -r ref; do
                test -f "dist/$ref" || { echo "::error::webfonts.css references missing $ref"; exit 1; }
              done

          # Every <languages/> bar lists every language the source has (#333 baked them short).
          # A page with N languages is emitted N+1 times and each copy carries N entries, so the
          # target is derived from the source tree rather than pinned to a number.
          expected=0
          for f in docs/*.wikitext; do
            grep -q '<languages */>' "$f" || continue
            base=$(basename "$f" .wikitext)
            langs=1
            if [ -d "docs/$base" ]; then
              langs=$(( langs + $(ls "docs/$base"/*.wikitext 2>/dev/null | wc -l) ))
            fi
            expected=$(( expected + langs * ( langs + 1 ) ))
          done
          # Once per skin the site renders: the default plus the two docs/.wikven.yml adds.
          expected=$(( expected * 3 ))
          found=$(find dist -name '*.html' -exec grep -ho 'mw-pt-progress--' {} + | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::$found language-bar entries across dist, expected $expected"
            exit 1
          fi

          # Every page the sidebar names gets a navigation row, and the two ends of the sequence get
          # one link rather than two. The order lives in MediaWiki:Sidebar and Module:Sequence reads
          # it (#455); before that it was restated in each call, and what went wrong twice was
          # exactly this -- a page in the sidebar with no row, and the last page with none either.
          missing=
          while IFS= read -r page; do
            file="dist/$(printf '%s' "$page" | tr ' ' '_').html"
            # The link div, not the wrapper: prevnext always emits the wrapper, so matching that
            # passes an empty row -- which is exactly what a broken module produces, and what the
            # first draft of this check waved through.
            if [ ! -s "$file" ] || ! grep -q 'class="wikven-prevnext-' "$file"; then
              missing="$missing $page"
            fi
          done < <(sed -n 's@^\*\* *Special:MyLanguage/\([^|]*\).*@\1@p' 'docs/MediaWiki:Sidebar.wikitext')
          if [ -n "$missing" ]; then
            echo "::error::sidebar pages with no navigation row:$missing"
            exit 1
          fi

          # A prevnext link is labelled with the target page's own title, so on a translated page it
          # must carry the translated one. The label is not in the calling page's source: the call
          # sits outside the translate tags and passes a page name, and the template reads the
          # title from the target's own title unit, which is the whole point -- a label restated in
          # the caller would be a second copy of a string that is already translated once.
          # Searching/ko is the fixture, and the expectation is read from the source rather than
          # written here: any Korean at all would pass a string pinned in this file. Which page
          # follows Searching is read from the sidebar for the same reason the row itself is --
          # naming it here would make this a check of a particular order rather than of the label.
          following=$(sed -n 's@^\*\* *Special:MyLanguage/\([^|]*\).*@\1@p' 'docs/MediaWiki:Sidebar.wikitext' \
            | awk '/^Searching$/ { if ((getline) > 0) print; exit }')
          # Checked before the file is read: awk on docs//ko.wikitext would abort the step with its
          # own error, which says nothing about the sidebar being what went wrong.
          if [ -z "$following" ]; then
            echo "::error::MediaWiki:Sidebar names no page after Searching, so this check has no pair to make"
            exit 1
          fi
          want=$(awk '/^<!--T:title[ -]/ { found = 1; next } found && NF { print; exit }' \
            "docs/$following/ko.wikitext")
          if [ -z "$want" ]; then
            echo "::error::docs/$following/ko.wikitext has no translated title to expect"
            exit 1
          fi
          # Newlines are flattened before the block is read: the template writes its markup over
          # several lines, and what is being matched is one span of it. An empty match fails the
          # case below rather than passing it, so a prevnext that stopped rendering is caught here
          # too.
          shown=$(tr '\n' ' ' < dist/Searching/ko.html | grep -o 'wikven-prevnext".\{0,700\}' \
            | head -n 1) || true
          case "$shown" in
            *"$want"*) ;;
            *)
              echo "::error::Searching/ko's prevnext does not show $following's Korean title ($want)"
              echo "$shown"
              exit 1
              ;;
          esac

          echo "Smoke checks passed."

      # Two bakes of the same source have to produce the same bytes, and until now nothing said so.
      # Everything in the bake that exists for it -- the frozen clock and SOURCE_DATE_EPOCH, the
      # frozen page_touched, the fifo job queue, the disabled NewPP limit report, the PNG timestamp
      # chunks stripped on import, the installer's main page deleted -- was written after someone
      # noticed the output moving between bakes, so the next regression was going to be found the
      # same way (#411).
      #
      # Same checkout, same image, same runner, so the bake itself is the only thing that can
      # differ. Baking from two separate clones is the stronger check and is not this one: it fails
      # today because importWikitext.php stamps revisions with filemtime(), which a second clone
      # changes (#406).
      #
      # Both bakes ran in the step above, at once; this only reads what they wrote.
      - name: Assert the two bakes are identical
        run: |
          set -euo pipefail
          if diff -rq dist dist-again; then
            echo "Two bakes of the same source are byte-identical."
          else
            echo "::error::two bakes of the same source are not identical (#411)"
            # The file list above says which pages moved; this says what moved in them, and is cut
            # off because a single differing byte in a shared header differs in every page.
            diff -r dist dist-again | head -n 200 || true
            exit 1
          fi

      # Node.js is preinstalled on the runner; no setup-node, whose caching trips the
      # cache-poisoning audit. Nothing this job does can reach a release on its own: it reads the
      # wikven-image layer cache and writes nothing, and a released binary builds from its own
      # per-architecture scope rather than that one. But the scope it reads is written by the job
      # that publishes the image, so a cache added here is one more entry for that audit to weigh.
      # At nine seconds for npm ci and the browser together, there is nothing worth buying with it.
      # The headless shell, not all of "chromium". Asking for chromium fetches Chrome for Testing
      # (379 MiB unpacked) as well as the shell (262 MiB), and these specs never start the former:
      # they run headless, which is what the shell is. ffmpeg (5 MiB) comes along either way, so what
      # this saves is the 379 MiB.
      #
      # And no --with-deps, which is the apt call. The runner image already carries Google Chrome,
      # Chromium, Edge and Firefox as installed packages, so the shared libraries the shell wants are
      # on the machine before we ask for anything; --with-deps was buying nothing and paying for it.
      # Twice -- 2026-08-18 and 2026-08-19 -- azure.archive.ubuntu.com answered nothing at all, apt
      # fell back to archive.ubuntu.com, took the four InRelease files and then went quiet on the
      # package indexes until the job was killed. A mirror that is not ours, on a path we do not need.
      #
      # Ran the suite locally against a real bake with nothing but the shell on disk: 57 passed. If
      # either half were ever not enough -- a spec asking for a headed browser, or a library the image
      # stops shipping -- Playwright says which executable or which .so it cannot find, so this cannot
      # quietly test the wrong thing.
      - name: Install the browser test tooling
        run: |
          npm ci
          npx playwright install chromium-headless-shell

      # The static server and its readiness check live in playwright.config.js (webServer), so the
      # same command works on a developer's machine too.
      - name: Assert the rendered site in a browser
        env:
          WIKVEN_BASE_URL: http://127.0.0.1:8080/wikven/
        run: npm run test:e2e
