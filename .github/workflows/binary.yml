---
name: Standalone binary

# Path-filtered, so this must stay non-required: a required check that never reports leaves the pull
# request unmergeable for good. release-please.yml and nightly.yml call the same job with a tag, which
# is what tells a release build (both architectures, attested and uploaded) from a pull request one.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'binary.Dockerfile'
      - 'bin/**'
      - 'caddy/**'
      - '.github/workflows/binary.yml'
  workflow_call:
    inputs:
      tag:
        description: The release tag to upload the binaries to.
        required: true
        type: string

permissions: {}

# Cancel superseded pull request runs; a release or nightly build is left to finish.
concurrency:
  group: binary-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ case(inputs.tag != '', fromJSON('["x86_64", "aarch64"]'), fromJSON('["x86_64"]')) }}
    runs-on: ${{ case(matrix.arch == 'aarch64', 'ubuntu-24.04-arm', 'ubuntu-latest') }}
    timeout-minutes: 60
    permissions:
      contents: write  # gh release upload
      id-token: write  # sign the build provenance attestation
      attestations: write  # write the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build the wikven image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          # A pull request reads the layer cache the image build shares, and writes nothing back.
          cache-from: type=gha,scope=wikven-image${{ case(inputs.tag != '', format('-{0}', matrix.arch), '') }}
          cache-to: ${{ case(inputs.tag != '', format('type=gha,mode=max,scope=wikven-image-{0}', matrix.arch), '') }}

      # binary.Dockerfile's export target FROMs the loaded image and writes out the compiled binary.
      - name: Build the standalone binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker build -f binary.Dockerfile --target export
          --secret id=github-token,env=GITHUB_TOKEN -o type=local,dest=out .

      - name: Name it per architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: mv out/wikven "wikven-linux-$ARCH"

      - name: Generate the checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: sha256sum "wikven-linux-$ARCH" > "wikven-linux-$ARCH.sha256"

      - name: Report what was built
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="wikven-linux-$ARCH"
          size=$(stat -c %s "$bin")
          sum=$(cut -d ' ' -f1 < "$bin.sha256")
          # Running it is the test: static linking fails at execution, not at compilation. php-cli reads
          # its first argument as a path inside the embedded app, so PHP's version comes off this line.
          out=$(./"$bin" version)
          frankenphp=${out%%$'\n'*}
          php=${frankenphp##*PHP }
          php=${php%% *}
          {
            echo "### Standalone binary: \`$bin\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Size | %s bytes (%s) |\n' "$size" "$(numfmt --to=iec "$size")"
            printf '| sha256 | `%s` |\n' "$sum"
            printf '| FrankenPHP | `%s` |\n' "$frankenphp"
            printf '| PHP | `%s` |\n' "$php"
          } >> "$GITHUB_STEP_SUMMARY"

      # Vulcain, which binary.Dockerfile leaves out of the xcaddy module list. Asserted on the built
      # artefact rather than on that list, because the list is a request and this is the answer: a
      # module reachable through another module's imports is linked whatever the flags said, which
      # is exactly the case of Mercure, and why Mercure is not asserted here.
      #
      # Grepped rather than read with `go version -m`, which would need a toolchain agreeing with
      # the one that built this. A Go binary carries its module paths as plain strings, so their
      # absence from the bytes is the whole claim.
      - name: Vulcain is not linked in
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if grep -aqF github.com/dunglas/vulcain "wikven-linux-$ARCH"; then
            echo "::error::vulcain is linked in; see the module list in binary.Dockerfile"
            exit 1
          fi

      # Handed to the bake job below, which is a separate job because it needs a runner without a
      # Docker build on it -- the point is to exercise the binary the way somebody who downloaded it
      # would, on a machine that has nothing of wikven's installed.
      - name: Hand the binary to the bake job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wikven-linux-${{ matrix.arch }}
          path: wikven-linux-${{ matrix.arch }}
          retention-days: 1

      # Sign the build provenance so users can `gh attestation verify` the binary.
      - name: Attest the binary
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: wikven-linux-${{ matrix.arch }}

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: >-
          gh release upload "$TAG"
          "wikven-linux-$ARCH"
          "wikven-linux-$ARCH.sha256"
          --clobber

  # Nothing else bakes anything with the binary. This workflow built it and ran `./wikven version`,
  # which proves the static link but not that the product works, and smoke.yml only ever uses the
  # Docker image. So a site the image can bake and the binary cannot has never been caught by
  # anything -- which is how this repository's own documentation came to hold a Lua module the
  # binary may not be able to render (#465, #473).
  #
  # Deliberately not folded into smoke.yml: that job belongs to the image, it is a required check,
  # and Lua is a niche of a niche. This one hangs off `binary`, so it runs exactly when a binary was
  # built and stays out of the way otherwise. It also runs on a plain runner with the binary
  # downloaded as an artifact, which is how somebody who fetched a release would meet it.
  bake:
    needs: binary
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ case(inputs.tag != '', fromJSON('["x86_64", "aarch64"]'), fromJSON('["x86_64"]')) }}
    runs-on: ${{ case(matrix.arch == 'aarch64', 'ubuntu-24.04-arm', 'ubuntu-latest') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wikven-linux-${{ matrix.arch }}

      - name: Make a source tree to bake
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p work/src
          cat > work/src/index.wikitext <<'EOF'
          Baked by the standalone binary.

          {{#invoke:Greet|thisPage}}
          EOF

          cat > 'work/src/Module:Greet' <<'EOF'
          local p = {}

          function p.thisPage()
            return 'lua ran on ' .. mw.title.getCurrentTitle().text
          end

          return p
          EOF

          chmod +x "wikven-linux-$ARCH"

      # A bake that refuses has to say so in its exit code, or a caller scripting on `wikven build`
      # -- a Makefile, a CI job, a deploy script -- reads the refusal as a success and ships nothing.
      # caddy/wikven.go goes to some trouble to propagate the child's status and says so in a
      # comment; this is the assertion that the whole chain, Caddy command to php-cli to the inner
      # maintenance run, actually delivers it.
      #
      # Checked with the cheapest refusal there is, a workdir with no src, so what is asserted is the
      # exit code and not any particular diagnosis.
      - name: A refused bake exits non-zero
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          mkdir -p empty
          status=0
          ( cd empty && WIKVEN_WORKDIR=. "$GITHUB_WORKSPACE/wikven-linux-$ARCH" build ) || status=$?
          echo "a bake with no source directory exited $status"
          if [ "$status" -eq 0 ]; then
            echo "::error::the binary refused the bake and still exited 0"
            exit 1
          fi

      # First, and before anything is installed, because that is the whole claim: somebody downloads
      # the binary onto a machine with no Lua on it and bakes a site with a module in it. Scribunto
      # carries its own lua binaries and falls back to them when luaPath is null, so where it ships
      # one for the architecture, this should work with nothing configured and nothing installed.
      #
      # Ordering matters more than it looks. Run after the install step and this passes for the wrong
      # reason: wikven's own luaEngineAvailable() would find the interpreter on PATH, and the bake
      # would never be asked whether it can manage without one.
      #
      # Asserted on x86_64 only, and not because the arm tarball is missing the files -- it carries
      # exactly the same ones. LuaStandaloneInterpreter chooses by PHP_OS and PHP_INT_SIZE and never
      # looks at the architecture, so on arm it picks lua5_1_5_linux_64_generic/lua, an x86-64 ELF,
      # passes its own is_executable() check on it, and fails only when the process will not start.
      # Asserting this on arm would be asserting somebody else's bug.
      - name: Bake with Scribunto's own bundled lua
        if: matrix.arch == 'x86_64'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cat > work/src/.wikven.yaml <<'EOF'
          extensions:
            - Scribunto
          EOF
          ( cd work && WIKVEN_WORKDIR=. "$GITHUB_WORKSPACE/wikven-linux-$ARCH" build )
          test -s work/dist/index.html
          grep -q 'lua ran on' work/dist/index.html

      # A Lua interpreter the host provides, which is the arrangement that works on any
      # architecture -- and the only one arm has, per the step above.
      #
      # luajit is a real fallback and not a consolation: Scribunto's standalone engine reads
      # `lua -v` and takes `LuaJIT ...` as readily as `Lua ...`, and LuaJIT is Lua 5.1, which is the
      # version Scribunto wants. Which of the two the runner has is recorded either way, because the
      # documentation this test exists to justify has to name something a reader can install.
      - name: Install a Lua interpreter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 \
            || sudo apt-get install -y --no-install-recommends luajit
          lua=$(command -v lua5.1 || command -v luajit)
          echo "LUA_INTERPRETER=$lua" >> "$GITHUB_ENV"
          echo "Using $lua: $("$lua" -v 2>&1 | head -1)"

      - name: Bake with a Lua interpreter the host provides
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf work/dist
          cat > work/src/.wikven.yaml <<EOF
          extensions:
            - Scribunto
          config:
            ScribuntoEngineConf:
              luastandalone:
                luaPath: $LUA_INTERPRETER
          EOF
          ( cd work && WIKVEN_WORKDIR=. "$GITHUB_WORKSPACE/wikven-linux-$ARCH" build )
          test -s work/dist/index.html
          if ! grep -q 'lua ran on' work/dist/index.html; then
            echo "::error::the binary baked a site, but the module's answer is not in it"
            grep -o '{{#invoke[^}]*}}' work/dist/index.html || true
            exit 1
          fi

      # The licenses page a build writes names what it ran on, and under the binary that includes
      # the server the binary is. caddy/wikven.go reads FrankenPHP and Caddy out of the Go build
      # info and hands them to the build in WIKVEN_RUNTIME, so nothing writes those versions down.
      #
      # Asserted here because this is the only place a binary bakes anything, and because the
      # mechanism fails quietly: should a static build ever stop carrying the build info, or the
      # modules be renamed again, the rows simply do not appear and the page still looks fine. This
      # is what notices. A license is asserted too, because naming one is the whole point: the
      # image's own environment rows deliberately leave that column empty. Caddy's is the one
      # checked -- FrankenPHP's "MIT" is three letters that a page of prose can produce by
      # accident, and an assertion that can pass for the wrong reason is not one.
      - name: The licenses page names the server the binary is
        run: |
          set -euo pipefail
          for expected in FrankenPHP Caddy Mercure Apache-2.0 AGPL-3.0; do
            if ! grep -rqF "$expected" work/dist; then
              echo "::error::the binary baked a site whose licenses page never mentions $expected"
              exit 1
            fi
          done

      # The translation helpers, which the binary had none of until now: the four are maintenance
      # scripts behind a booted MediaWiki, and the image was the only product that could boot one.
      # Asserted end to end on a tree that is translated, out of date and then not: `mark` numbers
      # the units, `scaffold` writes the skeleton, `check --gate` passes over a translation that is
      # merely stale, and `stamp` brings it up to date. Every one of them has to write into the
      # source tree the caller named, which under Docker is a mount and here is a plain directory.
      - name: Mark, scaffold, stamp and check translations
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/wikven-linux-$ARCH"
          mkdir -p translated/src
          cat > translated/src/.wikven.yaml <<'EOF'
          extensions:
            - UniversalLanguageSelector
            - Translate
          EOF
          cat > translated/src/index.wikitext <<'EOF'
          <languages />
          <translate>
          Wikven builds static sites from MediaWiki.
          </translate>
          EOF

          ( cd translated && WIKVEN_WORKDIR=. "$bin" translate mark --all )
          grep -q '<!--T:1-->' translated/src/index.wikitext

          ( cd translated && WIKVEN_WORKDIR=. "$bin" translate scaffold ko --all )
          test -s translated/src/index/ko.wikitext

          # Translated but unstamped, so check reports it and --gate still exits zero: a stale
          # translation is a warning, and only a source page nobody can translate is an error.
          printf '\n위크벤은 미디어위키로 정적 사이트를 만듭니다.\n' >> translated/src/index/ko.wikitext
          ( cd translated && WIKVEN_WORKDIR=. "$bin" translate check --gate )

          ( cd translated && WIKVEN_WORKDIR=. "$bin" translate stamp index/ko.wikitext )
          grep -qE '<!--T:1 @[0-9a-f]{8}-->' translated/src/index/ko.wikitext

      # A subcommand the binary does not have is a usage error, not a boot: the check comes before
      # the install, so a typo comes back at once rather than a minute later.
      - name: An unknown translate subcommand is refused
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          status=0
          ( cd translated && WIKVEN_WORKDIR=. "$GITHUB_WORKSPACE/wikven-linux-$ARCH" translate nonsense ) || status=$?
          echo "translate nonsense exited $status"
          if [ "$status" -eq 0 ]; then
            echo "::error::the binary accepted a translate subcommand it does not have"
            exit 1
          fi
