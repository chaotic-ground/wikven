---
name: Translations

# Report out-of-date and missing translations in this repository's own docs, and dogfood the
# composite action that does it: nothing else in continuous integration runs that action.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'actions/check-translations/**'
      - 'includes/PageTranslation/**'
      - 'maintenance/checkTranslations.php'
      - 'bin/entrypoint'
      - '.github/workflows/translations.yml'

permissions:
  contents: read
  # The comment below; a pull request from a fork gets a read-only token anyway, and the action
  # then says so in the log rather than failing.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Reader only; docker-image.yml exports this cache. See the note in smoke.yml.
      - name: Build and load this pull request's image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          cache-from: type=gha,scope=wikven-image

      - name: Check the docs translations
        uses: ./actions/check-translations
        with:
          source: docs
          image: wikven
          cache: false  # the image was just built locally; nothing to cache or pull
          # A broken source page fails here; staleness only annotates, since translating is not the
          # job of whoever edits the English source.
          gate: true
          # Dogfooding the other half: one comment on the pull request, saying which translate
          # command answers what was found. This repository takes translations from contributors,
          # which is exactly who the comment is for.
          comment: true
          # And the language half: whoever sent a translation reads the advice in the language they
          # sent it in, under the English.
          comment-languages: auto
