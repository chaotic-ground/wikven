---
name: PR preview

# Deploy a live preview of each documentation PR to a subfolder of the gh-pages branch,
# so a reviewer can browse the rendered site at pr-preview/pr-<N>/ and it is torn down when
# the PR closes. Only same-repo PRs opened by a human get one: a fork or Dependabot PR runs
# with a read-only GITHUB_TOKEN and cannot push to gh-pages, so those are skipped rather than
# failed. Runs on pull_request (not pull_request_target): the PR's own code is built, never
# with a write-scoped token.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'actions/bake/**'  # the preview build is the only thing that runs it
      - 'docs/**'
      - 'Dockerfile'
      - 'bin/entrypoint'
      - 'default.yml'
      - 'extension.json'
      - 'includes/**'
      - 'maintenance/**'
      - 'resources/**'
      - 'i18n/**'

permissions:
  contents: write  # push the preview to the gh-pages branch
  deployments: write  # record the preview as a native GitHub deployment (shown on the PR)

# One preview build per PR; a new push supersedes an in-flight one.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Skip forks and Dependabot: their token cannot push to gh-pages, so a preview would only fail.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Whole history, so the preview dates pages the way the deployed site does (#406).
          fetch-depth: 0

      - if: github.event.action != 'closed'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build and load this PR's image
        if: github.event.action != 'closed'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wikven
          # Reader only; docker-image.yml exports this cache. See the note in smoke.yml.
          cache-from: type=gha,scope=wikven-image

      - name: Bake the docs site
        if: github.event.action != 'closed'
        uses: ./actions/bake
        with:
          source: docs
          output: dist
          image: wikven
          cache: false  # the image was just built locally; nothing to cache or pull

      # Deploy dist/ to pr-preview/pr-<N>/ on gh-pages on open/sync, and remove it on close.
      # comment: false - the preview surfaces as a native GitHub deployment (below), not a comment.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false

      # Surface the preview as a native GitHub deployment, so the PR shows a "View deployment"
      # button and an environment badge instead of a comment. The URL matches the umbrella path
      # the action deploys to. auto-inactive is off so each open PR's preview stays active
      # independently (one shared "preview" environment, one deployment per PR head).
      - name: Record preview deployment
        if: success() && github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const number = context.payload.number;
            const url = `https://${context.repo.owner}.github.io/`
              + `${context.repo.repo}/pr-preview/pr-${number}/`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: `Preview for PR #${number}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: url,
              auto_inactive: false,
              description: 'Preview is live',
            });

      # On close, mark this PR's preview deployment inactive, matching the torn-down files.
      - name: Deactivate preview deployment
        if: always() && github.event.action == 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'preview',
              ref: context.payload.pull_request.head.sha,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview removed',
              });
            }
