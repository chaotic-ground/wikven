---
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# What CI clones beside wikven, which is two questions rather than one. phan wants the directories
# whose symbols this code reaches for; the wiki wants whatever will not load without it. Wikimedia
# keeps the answers in two files for this reason -- zuul/dependencies.yaml against
# zuul/phan_dependencies.yaml, chosen by whether the job name carries `-phan` -- and their entries
# for Translate share two of the ten names between them: the install side has UniversalLanguageSelector,
# the phan side does not, and the phan side has AbuseFilter and Echo and Elastica, which the install
# side does not. Same shape here, one name apart.
#
# Naming these also settles which source the action reads. It resolves from the first that answers --
# this input, then extension.json's requires, then the phan config -- so an extensions entry
# appearing in extension.json would otherwise take the phan config's place without a word.
env:
  # Mirrors .phan/config.php. Nothing is gained by cloning what phan will not parse.
  PHAN_DEPENDENCIES: >-
    Gadgets
    Translate
  # Translate refuses to install without UniversalLanguageSelector, and phan has no use for it --
  # which is why Translate's own phan config does not name it either. MobileFrontend is here for the
  # opposite reason: nothing reaches for its symbols, so phan has nothing to resolve, but Minerva
  # leans on it and every build of this documentation site fetches it, which makes the branches
  # behind ExtensionRegistry::isLoaded('MobileFrontend') live code on the site wikven is read on.
  WIKI_DEPENDENCIES: >-
    Gadgets
    MobileFrontend
    Translate
    UniversalLanguageSelector

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Everything below reads code, and a change under docs/ cannot reach a line of it: fifteen
  # runner-minutes spent on a pull request that could not have moved one assertion (#714). This job
  # answers whether anything outside docs/ changed, and the jobs below gate their expensive steps on
  # it. The jobs still run and still report -- they are required checks, and a required check that
  # never reports leaves a pull request unmergeable for good, which is why this workflow has no path
  # filter of its own.
  #
  # Every way of not knowing runs the tests. Only a diff that was read, and holds nothing outside
  # docs/, answers yes; a job whose steps read `!= 'true'` runs them on an answer that never came,
  # and each one below runs even if this job failed outright, for the same reason. The mistake this
  # can make is skipping a test somebody needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as the merge of its head into its base, so the base is
          # the first parent and the diff against it is the pull request itself. Two is all it takes
          # to have both ends of that diff.
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
              docs_only=true
            fi
            printf '%s\n' "$files" | sed 's/^/changed: /'
          fi
          echo "only docs/ changed: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  # Compile the Caddy plugin so a Go build error is caught on the PR, not later in the binary build.
  caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Runs whatever the job above concluded, including nothing: see it for why.
    if: ${{ !cancelled() }}
    steps:
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: caddy/go.mod
          cache-dependency-path: caddy/go.sum
      - if: needs.changes.outputs.docs-only != 'true'
        run: go build ./...
        working-directory: caddy
      - if: needs.changes.outputs.docs-only != 'true'
        run: go vet ./...
        working-directory: caddy
      - if: needs.changes.outputs.docs-only != 'true'
        run: go test ./...
        working-directory: caddy

  # Run the extension's PHPUnit tests against a real MediaWiki: the 1.46 base the build ships on, and master.
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Runs whatever the job above concluded, including nothing: see it for why.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        mediawiki-version: [REL1_46, master]
    steps:
      - name: Check out MediaWiki core
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.mediawiki-version }}
          path: mediawiki
          persist-credentials: false
      - name: Check out Wikven into the extension tree
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: mediawiki/extensions/Wikven
          persist-credentials: false
      - if: needs.changes.outputs.docs-only != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, calendar, sqlite3, pdo_sqlite, gd, dom, xml, fileinfo
          tools: composer
      - name: Install MediaWiki dependencies
        if: needs.changes.outputs.docs-only != 'true'
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      # --with-developmentsettings loads what Quibble loads; it turns on $wgEnableJavaScriptTest, which #392 needed.
      - name: Install MediaWiki (SQLite)
        if: needs.changes.outputs.docs-only != 'true'
        working-directory: mediawiki
        run: |
          mkdir -p "$RUNNER_TEMP/wikidb"
          php maintenance/run.php install \
            --dbtype=sqlite --dbpath="$RUNNER_TEMP/wikidb" \
            --scriptpath='' \
            --pass=adminpassword \
            --with-developmentsettings \
            TestWiki Admin
      - name: Enable Wikven
        if: needs.changes.outputs.docs-only != 'true'
        working-directory: mediawiki
        run: echo "wfLoadExtension( 'Wikven' );" >> LocalSettings.php
      - name: Run PHPUnit
        if: needs.changes.outputs.docs-only != 'true'
        working-directory: mediawiki
        run: composer phpunit:entrypoint -- extensions/Wikven/tests/phpunit/

  # phan needs a full MediaWiki environment to resolve core symbols; mago and phpcs can't provide one.
  phan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Runs whatever the job above concluded, including nothing: see it for why.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        mediawiki-version: [REL1_46, master]
    steps:
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs-only != 'true'
        uses: femiwiki/quibble-action@b57e2f3f990ed61d512d283cfb80a31977f2e56d  # v2.1.2
        with:
          stage: phan
          dependencies: ${{ env.PHAN_DEPENDENCIES }}
          mediawiki-version: ${{ matrix.mediawiki-version }}
          # PHP 8.3 image so the container resolves wikven's dev deps (>= 8.2); phan runs in the action's testrun image.
          quibble-docker-image: quibble-bookworm-php83

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Runs whatever the job above concluded, including nothing: see it for why.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      id-token: write
    steps:
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: quibble
        if: needs.changes.outputs.docs-only != 'true'
        uses: femiwiki/quibble-action@b57e2f3f990ed61d512d283cfb80a31977f2e56d  # v2.1.2
        with:
          stage: coverage
          dependencies: ${{ env.WIKI_DEPENDENCIES }}
          # The backend wikven builds on: bin/build.php installs with --dbtype sqlite, and
          # maintenance/build.php has paths that exist only there -- one writer at a time, a database
          # file per pass, SQLITE_BUSY. Quibble defaults to MySQL, which wikven never runs on, so
          # this is the one job standing where the product stands: its database and its extensions.
          # The phpunit jobs cover SQLite without the extensions, on both MediaWiki versions.
          db: sqlite
          # The coverage command runs PHPUnit and nothing else, so the standalone npm install
          # Quibble adds for it builds a Node tree no command here reads. Quibble's own help names
          # this case; composer dependencies are installed either way.
          skip-npm-install: true
          # Coverage tooling lives only on MediaWiki master.
          mediawiki-version: master
          quibble-docker-image: quibble-bookworm-php83
      # A change that ran no tests has no report to upload. codecov's checks are not required ones
      # (.tf/ruleset.tf lists the ones that are), so nothing waits on a report that never comes.
      - if: needs.changes.outputs.docs-only != 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ${{ steps.quibble.outputs.coverage }}/clover.xml
          use_oidc: true
