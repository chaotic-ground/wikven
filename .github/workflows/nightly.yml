---
name: Nightly

# Build the tip of main every day and publish it under that day's date: the standalone binaries as
# a dated pre-release (releases/download/nightly-<date>/wikven-linux-<arch>), and the container
# image as nightly-<date>. This is the way to track main -- :latest is the newest released version,
# and a plain push to main publishes nothing.
#
# GitHub's immutable releases lock a release's assets the moment it is published,
# so a single rolling tag can't be refreshed in place. Instead each run creates
# its own draft (drafts stay mutable), attaches the binaries, then publishes it.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Build only when a feat/fix landed since the last nightly; skip a run with only chores/CI.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          proceed=false
          last=$(git tag -l 'nightly-*' | sort -r | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$last" ]; then
            proceed=true
          elif git log "$last..HEAD" --format='%s' | grep -qE '^(feat|fix)(\(.+\))?!?:'; then
            proceed=true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the dated pre-release
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pick a dated tag for this build
        id: meta
        run: echo "tag=nightly-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # A draft stays mutable so the binary job can attach assets; drop any leftover same-day draft first.
      - name: Create the dated draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${TAG#nightly-}" \
            --notes "Standalone binaries built from main ($GITHUB_SHA)."

  binary:
    needs: prepare
    permissions:
      contents: write  # gh release upload
      id-token: write  # sign the build provenance attestation
      attestations: write  # write the build provenance attestation
    uses: ./.github/workflows/binary.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  # The image for this nightly, under the same dated tag as the binaries. It takes no other tag:
  # :latest belongs to the newest release, and a nightly is not one.
  docker:
    needs: prepare
    permissions:
      contents: read
      packages: write
      # Exchanged for a quay.io robot token. A called workflow can only lower what its caller grants.
      id-token: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, binary, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # publish (un-draft) the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Publishing locks the assets, so do it only once every architecture has been attached.
      - name: Publish the dated pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
